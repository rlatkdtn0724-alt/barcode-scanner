<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>부품번호 수량 스캐너</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #222;
    }

    h2 {
      text-align: center;
      margin: 5px 0 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .camera-button {
      display: block;
      width: 100%;
      padding: 17px;
      background: #2563eb;
      color: white;
      text-align: center;
      font-size: 19px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }

    #photoInput {
      display: none;
    }

    #preview {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      max-height: 450px;
      object-fit: contain;
      background: #eee;
    }

    #readButton {
      display: none;
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #readButton:disabled {
      background: #999;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }

    input.result-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 18px;
      margin-bottom: 18px;
    }

    #copyButton {
      width: 100%;
      padding: 15px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #status {
      padding: 13px;
      background: #e5e7eb;
      border-radius: 8px;
      line-height: 1.5;
      white-space: pre-wrap;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>부품번호 + 수량 스캐너</h2>

  <div class="card">

    <label for="photoInput" class="camera-button">
      📷 촬영하기
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img id="preview" alt="촬영한 부품 태그">

    <button id="readButton">
      부품번호와 수량 인식하기
    </button>

  </div>

  <div class="card">

    <label for="partNumber">부품번호</label>

    <input
      id="partNumber"
      class="result-input"
      type="text"
      placeholder="부품번호"
      autocomplete="off"
    >

    <label for="quantity">수량</label>

    <input
      id="quantity"
      class="result-input"
      type="number"
      min="1"
      inputmode="numeric"
      placeholder="수량"
    >

    <button id="copyButton">
      부품번호 + 수량 복사
    </button>

  </div>

  <div id="status">
    촬영하기 버튼을 눌러 태그를 촬영해 주세요.
  </div>

</div>

<script>
  const photoInput = document.getElementById("photoInput");
  const preview = document.getElementById("preview");
  const readButton = document.getElementById("readButton");
  const partNumber = document.getElementById("partNumber");
  const quantity = document.getElementById("quantity");
  const copyButton = document.getElementById("copyButton");
  const status = document.getElementById("status");

  let selectedFile = null;

  photoInput.addEventListener("change", function () {
    selectedFile = photoInput.files[0];

    if (!selectedFile) {
      return;
    }

    preview.src = URL.createObjectURL(selectedFile);
    preview.style.display = "block";
    readButton.style.display = "block";

    partNumber.value = "";
    quantity.value = "";

    status.textContent =
      "사진 촬영 완료\n" +
      "부품번호와 수량 인식하기 버튼을 눌러 주세요.";
  });

  readButton.addEventListener("click", async function () {
    if (!selectedFile) {
      alert("먼저 촬영해 주세요.");
      return;
    }

    readButton.disabled = true;
    status.textContent = "글자 인식 중입니다. 잠시 기다려 주세요.";

    try {
      const result = await Tesseract.recognize(
        selectedFile,
        "eng",
        {
          logger: function (info) {
            if (info.status === "recognizing text") {
              const percent = Math.round(info.progress * 100);

              status.textContent =
                "글자 인식 중...\n" +
                percent + "%";
            }
          }
        }
      );

      const originalText = result.data.text;

      console.log("OCR 원본:", originalText);

      const cleanedText = cleanText(originalText);

      console.log("정리된 글자:", cleanedText);

      const detectedPartNumber = findPartNumber(cleanedText);
      const detectedQuantity = findQuantity(cleanedText);

      partNumber.value = detectedPartNumber;
      quantity.value = detectedQuantity;

      if (detectedPartNumber && detectedQuantity) {
        status.textContent =
          "인식 완료\n\n" +
          "부품번호: " + detectedPartNumber + "\n" +
          "수량: " + detectedQuantity;
      } else if (!detectedPartNumber && !detectedQuantity) {
        status.textContent =
          "인식하지 못했습니다.\n\n" +
          "부품번호와 QUANTITY 숫자가 크게 보이도록 다시 촬영해 주세요.";
      } else if (!detectedPartNumber) {
        status.textContent =
          "수량은 인식했지만 부품번호를 찾지 못했습니다.";
      } else {
        status.textContent =
          "부품번호는 인식했지만 QUANTITY 옆 숫자를 찾지 못했습니다.";
      }

    } catch (error) {
      console.error(error);

      status.textContent =
        "인식 중 오류가 발생했습니다.\n" +
        error.message;
    }

    readButton.disabled = false;
  });

  function cleanText(text) {
    return String(text)
      .toUpperCase()
      .replace(/[|]/g, "I")
      .replace(/[\r\n]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function findPartNumber(text) {
    /*
      영문+숫자가 섞인 부품번호를 찾음.
      바코드 숫자만 있는 값은 제외함.
    */

    const candidates = text.match(/[A-Z0-9]{8,15}/g);

    if (!candidates) {
      return "";
    }

    const excludedWords = [
      "QUANTITY",
      "PARTNUMBER",
      "PARTNO",
      "PARTNUM",
      "DESCRIPTION",
      "LOCATION",
      "PRODUCT",
      "BMW",
      "MIN",
      "MAX"
    ];

    for (const candidate of candidates) {
      if (excludedWords.includes(candidate)) {
        continue;
      }

      if (/^\d+$/.test(candidate)) {
        continue;
      }

      if (/[A-Z]/.test(candidate) && /\d/.test(candidate)) {
        return candidate;
      }
    }

    return "";
  }

  function findQuantity(text) {
    /*
      QUANTITY 바로 옆 숫자만 인식

      예:
      QUANTITY 5
      QUANTITY: 5
      QUANTITY-5
    */

    const match = text.match(
      /QUANTITY\s*[:\-]?\s*(\d{1,5})/i
    );

    if (match) {
      return match[1];
    }

    return "";
  }

  copyButton.addEventListener("click", async function () {
    const part = partNumber.value.trim();
    const qty = quantity.value.trim();

    if (!part || !qty) {
      alert("부품번호와 수량을 확인해 주세요.");
      return;
    }

    const copyText = part + "\t" + qty;

    try {
      await navigator.clipboard.writeText(copyText);

      status.textContent =
        "복사 완료\n\n" +
        "부품번호: " + part + "\n" +
        "수량: " + qty;

    } catch (error) {
      alert(copyText);
    }
  });
</script>

</body>
</html>
