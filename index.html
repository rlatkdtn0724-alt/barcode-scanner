<body>

<div class="container">

<h1>부품 재고 조회</h1>

<label
    for="photoInput"
    class="capture-button">

    📷 부품 태그 촬영

</label>

<input
    id="photoInput"
    type="file"
    accept="image/*"
    capture="environment">

<div class="guide">

    <strong>촬영 방법</strong><br>

    ① 바코드가 사진에서 최대한 크게 보이게 촬영<br>
    ② 바코드 선이 흐려지지 않게 촬영<br>
    ③ 가능하면 바코드와 휴대폰을 수평으로 맞추기<br>
    ④ 촬영 후 「Code 39 찾기」를 눌러주세요<br>
    ⑤ 인식된 값에서 마지막 9자리를 부품번호로 사용합니다.

</div>

<div
    id="previewBox"
    class="preview-box">

    <img
        id="previewImage"
        alt="촬영한 사진">

</div>

<button
    id="analyzeButton"
    onclick="analyzePhoto()">

    🔎 사진에서 Code 39 찾기

</button>

<button
    id="retryButton"
    onclick="resetPage()">

    📷 다시 촬영

</button>

<div
    id="status"
    class="status">

    부품 태그를 촬영해주세요.

</div>

<div
    id="rawBox"
    class="debug">

    <div class="debug-title">
        Code 39 원본
    </div>

    <div
        id="rawValue"
        class="debug-value">
    </div>

</div>

<div

    class="debug">

    <div class="debug-title">
        추출된 부품번호
    </div>

        class="debug-value">
    </div>

</div>

<div

</div>

        </div>

            class="result-value">
        </div>

        </div>

</div>

<script>

let selectedFile = null;


/* =========================================================
   사진 선택
========================================================= */

document
    .getElementById("photoInput")
    .addEventListener(
        "change",
        handlePhoto
    );


function handlePhoto(event){

    const file =
        event.target.files &&
        event.target.files[0];

    if(!file){
        return;
    }

    selectedFile = file;

    const url =
        URL.createObjectURL(file);

    const image =
        document.getElementById(
            "previewImage"
        );

    image.onload = function(){

        URL.revokeObjectURL(url);

    };

    image.src = url;

    document
        .getElementById("previewBox")
        .style.display = "block";

    document
        .getElementById("analyzeButton")
        .style.display = "block";

    document
        .getElementById("retryButton")
        .style.display = "none";

    document
        .getElementById("result")
        .style.display = "none";

    document
        .getElementById("rawBox")
        .style.display = "none";

    document
        .getElementById("partBox")
        .style.display = "none";

    setStatus(
        "사진 촬영 완료. Code 39를 찾아보세요.",
        "warning"
    );

}


/* =========================================================
   사진 분석
========================================================= */

async function analyzePhoto(){

    if(!selectedFile){

        setStatus(
            "먼저 사진을 촬영해주세요.",
            "error"
        );

        return;
    }

    document
        .getElementById("loading")
        .style.display = "block";

    document
        .getElementById("analyzeButton")
        .disabled = true;

    setStatus(
        "사진을 확대하고 여러 방식으로 분석하고 있습니다...",
        "warning"
    );

    try{

        const variants =
            await createImageVariants(
                selectedFile
            );

        let result = null;

        for(
            let i = 0;
            i < variants.length;
            i++
        ){

            setStatus(
                "Code 39 분석 중... " +
                (i + 1) +
                " / " +
                variants.length,
                "warning"
            );

            try{

                result =
                    await scanImage(
                        variants[i]
                    );

                if(result){
                    break;
                }

            }catch(e){

                console.log(
                    "분석 실패:",
                    i,
                    e
                );

            }

        }

        if(!result){

            throw new Error(
                "Code 39를 찾지 못했습니다."
            );

        }

        console.log(
            "Code39 result:",
            result
        );


        /* 원본 Code39 */

        document
            .getElementById("rawBox")
            .style.display = "block";

        document
            .getElementById("rawValue")
            .textContent = result;


        /* 마지막 9자리 추출 */

        const part =
            extractLast9(result);


        if(!part){

            throw new Error(
                "부품번호를 추출하지 못했습니다."
            );

        }


        document
            .getElementById("partBox")
            .style.display = "block";

        document
            .getElementById("partValue")
            .textContent = part;


        /* 최종 결과 */

        document
            .getElementById("materialResult")
            .textContent = part;

        document
            .getElementById("quantityResult")
            .textContent = "-";

        document
            .getElementById("result")
            .style.display = "block";


        setStatus(
            "✅ Code 39 인식 완료",
            "success"
        );


    }catch(error){

        console.error(
            "Barcode error:",
            error
        );

        setStatus(
            "❌ Code 39를 찾지 못했습니다. 바코드를 더 크게 촬영해보세요.",
            "error"
        );

    }

    document
        .getElementById("loading")
        .style.display = "none";

    document
        .getElementById("analyzeButton")
        .disabled = false;

    document
        .getElementById("retryButton")
        .style.display = "block";

}


/* =========================================================
   이미지 변형 생성
========================================================= */

async function createImageVariants(file){

    const image =
        await loadImage(file);

    const variants = [];

    /*
     * 원본
     */
    variants.push(
        imageToFile(
            image,
            1,
            false,
            false
        )
    );

    /*
     * 2배 확대
     */
    variants.push(
        imageToFile(
            image,
            2,
            false,
            false
        )
    );

    /*
     * 3배 확대
     */
    variants.push(
        imageToFile(
            image,
            3,
            false,
            false
        )
    );

    /*
     * 2배 확대 + 흑백
     */
    variants.push(
        imageToFile(
            image,
            2,
            true,
            false
        )
    );

    /*
     * 3배 확대 + 흑백
     */
    variants.push(
        imageToFile(
            image,
            3,
            true,
            false
        )
    );

    /*
     * 3배 확대 + 강한 대비
     */
    variants.push(
        imageToFile(
            image,
            3,
            true,
            true
        )
    );

    return Promise.all(
        variants
    );

}


/* =========================================================
   이미지 → 파일
========================================================= */

function imageToFile(
    image,
    scale,
    grayscale,
    contrast
){

    return new Promise(
        function(resolve){

            const canvas =
                document.createElement(
                    "canvas"
                );

            let width =
                image.naturalWidth;

            let height =
                image.naturalHeight;


            /*
             * 너무 큰 이미지는 제한
             */

            const maxSize =
                5000;

            if(
                width * scale >
                maxSize
            ){

                scale =
                    maxSize /
                    width;

            }

            if(
                height * scale >
                maxSize
            ){

                scale =
                    Math.min(
                        scale,
                        maxSize /
                        height
                    );

            }


            canvas.width =
                Math.round(
                    width * scale
                );

            canvas.height =
                Math.round(
                    height * scale
                );


            const ctx =
                canvas.getContext(
                    "2d",
                    {
                        willReadFrequently:true
                    }
                );


            ctx.drawImage(
                image,
                0,
                0,
                canvas.width,
                canvas.height
            );


            if(
                grayscale ||
                contrast
            ){

                const data =
                    ctx.getImageData(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );

                const pixels =
                    data.data;


                for(
                    let i = 0;
                    i < pixels.length;
                    i += 4
                ){

                    let r =
                        pixels[i];

                    let g =
                        pixels[i + 1];

                    let b =
                        pixels[i + 2];


                    /*
                     * 흑백
                     */

                    if(grayscale){

                        const gray =
                            (
                                r * 0.299 +
                                g * 0.587 +
                                b * 0.114
                            );

                        r = gray;
                        g = gray;
                        b = gray;

                    }


                    /*
                     * 대비 증가
                     */

                    if(contrast){

                        const factor =
                            1.8;

                        r =
                            ((r - 128) *
                            factor) + 128;

                        g =
                            ((g - 128) *
                            factor) + 128;

                        b =
                            ((b - 128) *
                            factor) + 128;

                    }


                    pixels[i] =
                        clamp(r);

                    pixels[i + 1] =
                        clamp(g);

                    pixels[i + 2] =
                        clamp(b);

                }


                ctx.putImageData(
                    data,
                    0,
                    0
                );

            }


            canvas.toBlob(
                function(blob){

                    resolve(
                        new File(
                            [blob],
                            "barcode.jpg",
                            {
                                type:"image/jpeg"
                            }
                        )
                    );

                },
                "image/jpeg",
                0.95
            );

        }
    );

}


/* =========================================================
   이미지 로드
========================================================= */

function loadImage(file){

    return new Promise(
        function(resolve, reject){

            const url =
                URL.createObjectURL(file);

            const image =
                new Image();

            image.onload =
                function(){

                    URL.revokeObjectURL(
                        url
                    );

                    resolve(image);

                };

            image.onerror =
                reject;

            image.src = url;

        }
    );

}


/* =========================================================
   Code39 사진 스캔
========================================================= */

async function scanImage(file){

    const id =
        "barcodeReader_" +
        Date.now();

    const temp =
        document.createElement(
            "div"
        );

    temp.id = id;

    temp.style.position =
        "fixed";

    temp.style.left =
        "-99999px";

    temp.style.top =
        "-99999px";

    temp.style.width =
        "1px";

    temp.style.height =
        "1px";

    document.body.appendChild(
        temp
    );


    const scanner =
        new Html5Qrcode(id);


    try{

        const result =
            await scanner.scanFile(
                file,
                false
            );

        try{
            await scanner.clear();
        }catch(e){}

        temp.remove();

        return result;

    }catch(error){

        try{
            await scanner.clear();
        }catch(e){}

        temp.remove();

        return null;

    }

}


/* =========================================================
   숫자 범위
========================================================= */

function clamp(value){

    return Math.max(
        0,
        Math.min(
            255,
            value
        )
    );

}


/* =========================================================
   뒤 9자리
========================================================= */

function extractLast9(raw){

    if(
        raw === null ||
        raw === undefined
    ){

        return null;

    }


    let value =
        String(raw)
            .trim()
            .toUpperCase();


    /*
     * Code39 * 제거
     */

    value =
        value.replace(
            /^\*+/,
            ""
        );

    value =
        value.replace(
            /\*+$/,
            ""
        );


    /*
     * 공백 제거
     */

    value =
        value.replace(
            /\s+/g,
            ""
        );


    /*
     * 최소 9자리
     */

    if(
        value.length < 9
    ){

        return null;

    }


    /*
     * 마지막 9자리
     */

    return value.slice(-9);

}


/* =========================================================
   상태
========================================================= */

function setStatus(
    text,
    type
){

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        text;

    status.className =
        "status " +
        (type || "");

}


/* =========================================================
   초기화
========================================================= */

function resetPage(){

    selectedFile =
        null;


    document
        .getElementById(
            "photoInput"
        )
        .value = "";


    document
        .getElementById(
            "previewBox"
        )
        .style.display = "none";


    document
        .getElementById(
            "analyzeButton"
        )
        .style.display = "none";


    document
        .getElementById(
            "retryButton"
        )
        .style.display = "none";


    document
        .getElementById(
            "rawBox"
        )
        .style.display = "none";


    document
        .getElementById(
            "partBox"
        )
        .style.display = "none";


    document
        .getElementById(
            "result"
        )
        .style.display = "none";


    document
        .getElementById(
            "loading"
        )
        .style.display = "none";


    setStatus(
        "부품 태그를 촬영해주세요.",
        "warning"
    );

}

</script>

</body>
</html>
