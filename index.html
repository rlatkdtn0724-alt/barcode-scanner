<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f4f4;
    color:#111;

<body>

<div class="container">

<h1>부품 재고 조회</h1>


<!-- =====================================================
     카메라 시작
====================================================== -->

<button
    id="startButton"
    class="start-button"
    onclick="startScanner()">

    📷 Code 39 스캔

</button>


<!-- =====================================================
     사진으로 스캔
====================================================== -->

<button
    class="file-button"
    onclick="document.getElementById('fileInput').click()">

    🖼️ 사진으로 바코드 읽기

</button>

<input
    id="fileInput"
    type="file"
    accept="image/*"
    style="display:none"
    onchange="scanImageFile(event)">


<!-- =====================================================
     카메라
====================================================== -->

<div id="reader">

    <div class="scan-guide"></div>

    <div class="camera-controls">

        <button onclick="stopScanner()">
            스캔 종료
        </button>

    </div>

</div>


<!-- =====================================================
     상태
====================================================== -->

<div
    id="status"
    class="status">

    Code 39 바코드를 스캔하세요.

</div>


<!-- =====================================================
     원본
====================================================== -->

<div
    id="rawBox"
    class="debug">

    <div class="debug-title">
        Code 39 원본
    </div>

    <div
        id="rawValue"
        class="debug-value">
    </div>

</div>


<!-- =====================================================
     추출값
====================================================== -->

<div
    id="partBox"
    class="debug">

    <div class="debug-title">
        뒤 9자리
    </div>

    <div
        id="partValue"
        class="debug-value">
    </div>

</div>


<!-- =====================================================
     결과
====================================================== -->

<div
    id="result"
    class="result">

    <div class="row">

        <div class="label">
            부품번호
        </div>

        <div
            id="materialResult"
            class="value">
        </div>

    </div>


    <div class="row">

        <div class="label">
            Quantity
        </div>

        <div
            id="quantityResult"
            class="value">

            -

        </div>

    </div>

</div>


<!-- =====================================================
     수동
====================================================== -->

<div
    id="manualBox"
    class="manual">

    <input
        id="manualPart"
        type="text"
        placeholder="부품번호 9자리">

    <button
        onclick="manualSearch()">

        입력

    </button>

</div>

</div>


<script>

/* =========================================================
   기본
========================================================= */

let scanner = null;

let scanning = false;

let currentPart = "";

let lastResult = "";

let lastResultTime = 0;


/*
 * 같은 결과를 여러 번 확인
 */
const REQUIRED_CONFIRM = 2;

let confirmValue = "";

let confirmCount = 0;


/* =========================================================
   상태
========================================================= */

function setStatus(
    text,
    type = ""
){

    const el =
        document.getElementById(
            "status"
        );

    el.textContent =
        text;

    el.className =
        "status";

    if(type){

        el.classList.add(
            type
        );

    }

}


/* =========================================================
   Code 39 원본 → 뒤 9자리
========================================================= */

function extractLast9(
    raw
){

    if(
        raw === null ||
        raw === undefined
    ){

        return null;

    }


    let value =
        String(raw)
            .trim()
            .toUpperCase();


    /*
     * Code 39 Start / Stop 문자 제거
     */
    value =
        value.replace(
            /^\*+/,
            ""
        );

    value =
        value.replace(
            /\*+$/,
            ""
        );


    /*
     * 앞뒤 공백 제거
     */
    value =
        value.trim();


    /*
     * 최소 9자리 필요
     */
    if(
        value.length < 9
    ){

        return null;

    }


    /*
     * ★ 무조건 마지막 9자리
     */
    return value.slice(
        -9
    );

}


/* =========================================================
   결과 처리
========================================================= */

function handleBarcode(
    raw
){

    if(!raw){

        return;

    }


    const now =
        Date.now();


    /*
     * 같은 값 계속 들어오는 것 방지
     */
    if(
        raw === lastResult &&
        now - lastResultTime < 1000
    ){

        return;

    }


    lastResult =
        raw;

    lastResultTime =
        now;


    /*
     * 원본 표시
     */

    document
        .getElementById(
            "rawBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "rawValue"
        )
        .textContent =
        raw;


    /*
     * 뒤 9자리
     */

    const part =
        extractLast9(
            raw
        );


    if(!part){

        setStatus(
            "바코드는 읽었지만 9자리를 추출하지 못했습니다.",
            "warning"
        );

        return;

    }


    /*
     * 같은 값 확인
     */

    if(
        part === confirmValue
    ){

        confirmCount++;

    }else{

        confirmValue =
            part;

        confirmCount =
            1;

    }


    /*
     * 추출값 표시
     */

    document
        .getElementById(
            "partBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "partValue"
        )
        .textContent =
        part;


    setStatus(
        "부품번호 확인 " +
        Math.min(
            confirmCount,
            REQUIRED_CONFIRM
        ) +
        "/" +
        REQUIRED_CONFIRM,
        "warning"
    );


    /*
     * 2번 확인
     */

    if(
        confirmCount >=
        REQUIRED_CONFIRM
    ){

        currentPart =
            part;


        finishBarcode();

    }

}


/* =========================================================
   스캔 완료
========================================================= */

function finishBarcode(){

    stopScanner();


    document
        .getElementById(
            "materialResult"
        )
        .textContent =
        currentPart;


    document
        .getElementById(
            "quantityResult"
        )
        .textContent =
        "-";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "block";


    setStatus(
        "✅ 부품번호 인식 완료: " +
        currentPart,
        "success"
    );

}


/* =========================================================
   카메라 시작
========================================================= */

async function startScanner(){

    if(scanning){

        return;

    }


    /*
     * 상태 초기화
     */

    confirmValue =
        "";

    confirmCount =
        0;

    currentPart =
        "";


    document
        .getElementById(
            "reader"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "rawBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "partBox"
        )
        .style.display =
        "none";


    setStatus(
        "카메라를 준비하고 있습니다...",
        "warning"
    );


    try{

        /*
         * CODE_39만 사용
         */
        const formats =
            [
                Html5QrcodeSupportedFormats
                    .CODE_39
            ];


        scanner =
            new Html5Qrcode(
                "reader"
            );


        const config = {

            fps:10,

            qrbox:function(
                width,
                height
            ){

                /*
                 * 가로로 긴 바코드에 맞게
                 * 스캔 영역을 설정
                 */
                const boxWidth =
                    Math.floor(
                        width * .88
                    );


                const boxHeight =
                    Math.floor(
                        Math.min(
                            180,
                            height * .22
                        )
                    );


                return {
                    width:
                        boxWidth,

                    height:
                        boxHeight
                };

            },


            aspectRatio:1.7777778,

            formatsToSupport:
                formats,

            rememberLastUsedCamera:
                true,

            showTorchButtonIfSupported:
                true

        };


        /*
         * 카메라 목록 확인
         */

        const cameras =
            await Html5Qrcode
                .getCameras();


        if(
            !cameras ||
            !cameras.length
        ){

            throw new Error(
                "카메라가 없습니다."
            );

        }


        /*
         * 후면 카메라 우선
         */

        let camera =
            cameras.find(
                c => {

                    const label =
                        String(
                            c.label ||
                            ""
                        ).toLowerCase();


                    return(
                        label.includes(
                            "back"
                        ) ||

                        label.includes(
                            "rear"
                        ) ||

                        label.includes(
                            "environment"
                        )

                    );

                }
            );


        if(!camera){

            camera =
                cameras[
                    cameras.length - 1
                ];

        }


        /*
         * 시작
         */

        await scanner.start(

            camera.id,

            config,

            function(
                decodedText,
                decodedResult
            ){

                console.log(
                    "CODE39:",
                    decodedText,
                    decodedResult
                );


                handleBarcode(
                    decodedText
                );

            },

            function(errorMessage){

                /*
                 * 정상적인 탐색 중에는
                 * 오류 메시지를 표시하지 않는다.
                 */

            }

        );


        scanning =
            true;


        setStatus(
            "Code 39 바코드를 화면 중앙에 맞춰주세요.",
            "warning"
        );


    }catch(error){

        console.error(
            error
        );


        scanning =
            false;


        document
            .getElementById(
                "reader"
            )
            .style.display =
            "none";


        setStatus(
            "카메라를 시작하지 못했습니다.",
            "error"
        );


        document
            .getElementById(
                "manualBox"
            )
            .style.display =
            "block";

    }

}


/* =========================================================
   사진 파일 스캔
========================================================= */

async function scanImageFile(
    event
){

    const file =
        event.target.files &&
        event.target.files[0];


    if(!file){

        return;

    }


    setStatus(
        "사진에서 Code 39를 찾고 있습니다...",
        "warning"
    );


    try{

        /*
         * 임시 스캐너
         */
        const tempScanner =
            new Html5Qrcode(
                "reader"
            );


        /*
         * 파일 스캔
         */
        const result =
            await tempScanner
                .scanFile(
                    file,
                    true
                );


        console.log(
            "파일 Code39:",
            result
        );


        handleBarcode(
            result
        );


        try{

            tempScanner.clear();

        }catch(e){}


    }catch(error){

        console.error(
            error
        );


        setStatus(
            "사진에서 Code 39를 찾지 못했습니다. 바코드를 크게 찍어주세요.",
            "error"
        );

    }


    /*
     * 같은 파일 다시 선택할 수 있도록
     * input 초기화
     */

    event.target.value =
        "";

}


/* =========================================================
   종료
========================================================= */

async function stopScanner(){

    try{

        if(
            scanner &&
            scanning
        ){

            await scanner.stop();

        }

    }catch(error){

        console.log(
            error
        );

    }


    try{

        if(scanner){

            await scanner.clear();

        }

    }catch(error){}


    scanner =
        null;

    scanning =
        false;


    document
        .getElementById(
            "reader"
        )
        .style.display =
        "none";

}


/* =========================================================
   수동
========================================================= */

function manualSearch(){

    const value =
        document
            .getElementById(
                "manualPart"
            )
            .value
            .trim()
            .toUpperCase();


    if(
        value.length !== 9
    ){

        setStatus(
            "부품번호는 9자리로 입력해주세요.",
            "error"
        );

        return;

    }


    currentPart =
        value;


    document
        .getElementById(
            "materialResult"
        )
        .textContent =
        currentPart;


    document
        .getElementById(
            "quantityResult"
        )
        .textContent =
        "-";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "block";


    setStatus(
        "✅ 입력 완료",
        "success"
    );

}


/* =========================================================
   페이지 종료
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        stopScanner();

    }
);

</script>

</body>
</html>
```
