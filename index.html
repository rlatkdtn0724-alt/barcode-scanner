<script>


/* =========================================================
   설정
========================================================= */


/*
 * Code 39에서 읽은 값 중
 * 마지막 9자리 사용
 */
const PART_LENGTH = 9;


/*
 * 바코드가 같은 값으로
 * 2번 확인되면 확정
 */
const BARCODE_CONFIRM = 2;


/*
 * Quantity도 2번 같은 값이면 확정
 */
const QTY_CONFIRM = 2;


/* =========================================================
   전역
========================================================= */

let scannerRunning = false;


/*
 * 바코드
 */
let barcodeCandidate = "";

let barcodeCount = 0;


/*
 * 최종 부품번호
 */
let partNumber = "";


/*
 * Quantity
 */
let quantity = null;

let quantityCandidate = null;

let quantityCount = 0;


/*
 * 카메라
 */
let currentTrack = null;

let currentZoom = 1;

let minZoom = 1;

let maxZoom = 1;

let torchOn = false;


/*
 * OCR
 */
let ocrWorker = null;

let ocrReady = false;

let ocrRunning = false;

let quantityTimer = null;


/* =========================================================
   상태
========================================================= */

function setStatus(
    text,
    type=""
){

    const el =
        document.getElementById(
            "status"
        );

    el.textContent =
        text;

    el.className =
        "status";

    if(type){

        el.classList.add(
            type
        );

    }

}


/* =========================================================
   바코드 뒤 9자리 추출
========================================================= */

function extractLast9(
    raw
){

    if(
        raw === null ||
        raw === undefined
    ){

        return null;

    }


    let value =
        String(raw).trim();


    /*
     * Code39 양쪽 * 제거
     */
    value =
        value.replace(
            /^\*|\*$/g,
            ""
        );


    /*
     * 공백 제거
     */
    value =
        value.replace(
            /\s/g,
            ""
        );


    /*
     * 대문자 통일
     */
    value =
        value.toUpperCase();


    /*
     * ★ 마지막 9자리
     *
     * 예:
     * JC615B5FC41
     *
     * → 615B5FC41
     */

    if(
        value.length <
        PART_LENGTH
    ){

        return null;

    }


    return value.slice(
        -PART_LENGTH
    );

}


/* =========================================================
   바코드 처리
========================================================= */

function processBarcode(
    result
){

    if(!scannerRunning){

        return;

    }


    if(
        !result ||
        !result.codeResult
    ){

        return;

    }


    const raw =
        result.codeResult.code;


    if(!raw){

        return;

    }


    console.log(
        "Code39:",
        raw
    );


    /*
     * 원본 표시
     */

    document
        .getElementById(
            "barcodeDebug"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "barcodeRaw"
        )
        .textContent =
        raw;


    /*
     * 마지막 9자리
     */

    const extracted =
        extractLast9(
            raw
        );


    if(!extracted){

        setStatus(
            "바코드는 읽었지만 9자리를 추출할 수 없습니다.",
            "warning"
        );

        return;

    }


    /*
     * 추출값 표시
     */

    document
        .getElementById(
            "partDebug"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "partDebugValue"
        )
        .textContent =
        extracted;


    /*
     * 같은 값 확인
     */

    if(
        extracted ===
        barcodeCandidate
    ){

        barcodeCount++;

    }else{

        barcodeCandidate =
            extracted;

        barcodeCount =
            1;

    }


    document
        .getElementById(
            "cameraStatus"
        )
        .textContent =

        "부품번호 확인 " +

        Math.min(
            barcodeCount,
            BARCODE_CONFIRM
        ) +

        "/" +

        BARCODE_CONFIRM;


    /*
     * 2번 확인
     */

    if(
        barcodeCount >=
        BARCODE_CONFIRM
    ){

        partNumber =
            extracted;


        /*
         * Quantity 읽기
         */

        setStatus(
            "✅ 부품번호 " +
            partNumber +
            " / Quantity를 읽는 중...",
            "success"
        );


        document
            .getElementById(
                "cameraStatus"
            )
            .textContent =
            "Quantity를 읽는 중...";


        startQuantityOCR();

    }

}


/* =========================================================
   Quagga 시작
========================================================= */

async function startScanner(){

    if(scannerRunning){

        return;

    }


    barcodeCandidate =
        "";

    barcodeCount =
        0;

    partNumber =
        "";

    quantity =
        null;

    quantityCandidate =
        null;

    quantityCount =
        0;


    document
        .getElementById(
            "scannerBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "barcodeDebug"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "partDebug"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "quantityDebug"
        )
        .style.display =
        "none";


    setStatus(
        "카메라를 준비하고 있습니다...",
        "warning"
    );


    try{

        await initializeQuagga();

    }catch(error){

        console.error(
            error
        );


        setStatus(
            "카메라를 시작할 수 없습니다.",
            "error"
        );


        document
            .getElementById(
                "manualBox"
            )
            .style.display =
            "block";

    }

}


/* =========================================================
   Quagga
========================================================= */

function initializeQuagga(){

    return new Promise(
        function(resolve,reject){

            try{

                Quagga.stop();

            }catch(e){}


            Quagga.init({

                inputStream:{

                    name:"Live",

                    type:"LiveStream",

                    target:
                        document.querySelector(
                            "#scanner"
                        ),

                    constraints:{

                        facingMode:{
                            ideal:"environment"
                        },

                        width:{
                            min:1280,
                            ideal:1920,
                            max:2560
                        },

                        height:{
                            min:720,
                            ideal:1080,
                            max:1440
                        }

                    },

                    area:{

                        top:"20%",
                        right:"5%",
                        left:"5%",
                        bottom:"30%"

                    }

                },


                /*
                 * Code 39에 집중
                 */
                locator:{

                    halfSample:false,

                    patchSize:"medium"

                },


                frequency:10,

                locate:true,


                decoder:{

                    /*
                     * ★ Code 39 하나만 사용
                     */
                    readers:[
                        "code_39_reader"
                    ],

                    multiple:false

                },


                numOfWorkers:2,


                debug:{

                    drawBoundingBox:false,

                    showFrequency:false,

                    drawScanline:false,

                    showPattern:false

                }

            },function(error){

                if(error){

                    reject(error);

                    return;

                }


                try{

                    Quagga.start();

                    scannerRunning =
                        true;

                }catch(e){

                    reject(e);

                    return;

                }


                setTimeout(
                    setupCamera,
                    800
                );


                setStatus(
                    "Code 39 바코드를 흰색 박스에 맞춰주세요.",
                    "warning"
                );


                resolve();

            });

        }
    );

}


/* =========================================================
   Quagga 이벤트
========================================================= */

Quagga.onDetected(
    processBarcode
);


/* =========================================================
   카메라
========================================================= */

function setupCamera(){

    try{

        const video =
            document.querySelector(
                "#scanner video"
            );


        if(
            !video ||
            !video.srcObject
        ){

            return;

        }


        const tracks =
            video
                .srcObject
                .getVideoTracks();


        if(
            !tracks ||
            !tracks.length
        ){

            return;

        }


        currentTrack =
            tracks[0];


        const caps =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};


        if(caps.zoom){

            minZoom =
                caps.zoom.min || 1;

            maxZoom =
                caps.zoom.max || 1;


            currentZoom =
                Math.min(
                    Math.max(
                        1.3,
                        minZoom
                    ),
                    maxZoom
                );


            applyZoom();

        }


        if(
            caps.focusMode &&
            caps.focusMode.includes(
                "continuous"
            )
        ){

            currentTrack
                .applyConstraints({

                    advanced:[
                        {
                            focusMode:
                                "continuous"
                        }
                    ]

                })
                .catch(
                    () => {}
                );

        }

    }catch(e){

        console.log(
            e
        );

    }

}


/* =========================================================
   Quantity OCR 준비
========================================================= */

async function prepareOCR(){

    if(ocrReady){

        return;

    }


    if(
        typeof Tesseract ===
        "undefined"
    ){

        throw new Error(
            "OCR 엔진을 불러오지 못했습니다."
        );

    }


    setStatus(
        "Quantity OCR 준비 중...",
        "warning"
    );


    ocrWorker =
        await Tesseract.createWorker(
            "eng"
        );


    await ocrWorker.setParameters({

        /*
         * 한 줄
         */
        tessedit_pageseg_mode:
            "7",

        /*
         * 숫자만 허용
         */
        tessedit_char_whitelist:
            "0123456789"

    });


    ocrReady =
        true;

}


/* =========================================================
   Quantity OCR 시작
========================================================= */

async function startQuantityOCR(){

    if(ocrRunning){

        return;

    }


    try{

        await prepareOCR();

    }catch(error){

        console.error(
            error
        );

        setStatus(
            "Quantity OCR을 시작하지 못했습니다.",
            "error"
        );

        return;

    }


    ocrRunning =
        true;


    runQuantityLoop();

}


/* =========================================================
   Quantity OCR 반복
========================================================= */

function runQuantityLoop(){

    if(
        !scanning &&
        !partNumber
    ){

        return;

    }


    clearTimeout(
        quantityTimer
    );


    quantityTimer =
        setTimeout(
            async function(){

                try{

                    await readQuantity();

                }catch(error){

                    console.log(
                        error
                    );

                }


                /*
                 * Quantity가 확정되지 않았다면
                 * 계속 읽음
                 */
                if(
                    quantity === null
                ){

                    runQuantityLoop();

                }

            },
            1200
        );

}


/* =========================================================
   Quantity 영역 캡처
========================================================= */

function captureQuantityImage(){

    const video =
        document.getElementById(
            "scanner"
        )
        .querySelector(
            "video"
        );


    if(
        !video ||
        video.readyState < 2
    ){

        return null;

    }


    const w =
        video.videoWidth;

    const h =
        video.videoHeight;


    if(!w || !h){

        return null;

    }


    /*
     * Quantity가 있는
     * 하단 영역만 가져온다.
     *
     * Location은 더 아래에 있다고
     * 가정하고 제외한다.
     */

    const sx =
        Math.round(
            w * .08
        );

    const sy =
        Math.round(
            h * .64
        );

    const sw =
        Math.round(
            w * .84
        );

    const sh =
        Math.round(
            h * .12
        );


    /*
     * 확대
     */
    const scale = 4;


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        sw * scale;

    canvas.height =
        sh * scale;


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    ctx.drawImage(

        video,

        sx,
        sy,
        sw,
        sh,

        0,
        0,
        canvas.width,
        canvas.height

    );


    /*
     * 회색조 + 대비 강화
     */

    const image =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data =
        image.data;


    for(
        let i=0;
        i<data.length;
        i+=4
    ){

        const r =
            data[i];

        const g =
            data[i+1];

        const b =
            data[i+2];


        let gray =
            0.299*r +
            0.587*g +
            0.114*b;


        gray =
            (gray - 128)*2 +
            128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i+1] =
            gray;

        data[i+2] =
            gray;

    }


    ctx.putImageData(
        image,
        0,
        0
    );


    return canvas;

}


/* =========================================================
   Quantity 숫자 추출
========================================================= */

function extractQuantity(
    text
){

    if(!text){

        return null;

    }


    /*
     * 줄별 분석
     */

    const lines =
        String(text)
            .split(/\r?\n/)
            .map(
                x =>
                    x.trim()
            )
            .filter(
                x =>
                    x.length
            );


    /*
     * Quantity라는 단어가 있으면
     * 그 줄의 숫자를 우선
     */

    for(
        const line of lines
    ){

        if(
            /quantity|qty/i.test(
                line
            )
        ){

            const match =
                line.match(
                    /\d+/
                );


            if(match){

                return Number(
                    match[0]
                );

            }

        }

    }


    /*
     * 숫자만 OCR된 경우
     *
     * 숫자 하나만 있으면 사용
     */

    const nums =
        String(text)
            .match(
                /\d+/g
            ) || [];


    if(
        nums.length === 1
    ){

        return Number(
            nums[0]
        );

    }


    /*
     * 여러 숫자가 있다면
     * Quantity 영역 특성상 가장 짧은 숫자를 우선
     *
     * 단, 1개 이상
     */

    if(
        nums.length > 1
    ){

        const valid =
            nums.filter(
                n =>
                    Number(n) > 0
            );


        if(
            valid.length
        ){

            valid.sort(
                (a,b) =>
                    a.length -
                    b.length
            );


            return Number(
                valid[0]
            );

        }

    }


    return null;

}


/* =========================================================
   Quantity 읽기
========================================================= */

async function readQuantity(){

    if(
        !ocrWorker ||
        !partNumber
    ){

        return;

    }


    const canvas =
        captureQuantityImage();


    if(!canvas){

        return;

    }


    document
        .getElementById(
            "cameraStatus"
        )
        .textContent =
        "Quantity 인식 중...";


    const result =
        await ocrWorker.recognize(
            canvas
        );


    const text =
        result &&
        result.data
            ? result.data.text
            : "";


    /*
     * 원본
     */

    document
        .getElementById(
            "quantityDebug"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "quantityRaw"
        )
        .textContent =
        text ||
        "(인식되지 않음)";


    /*
     * 숫자 추출
     */

    const value =
        extractQuantity(
            text
        );


    if(
        value === null ||
        !Number.isFinite(value) ||
        value <= 0
    ){

        return;

    }


    /*
     * 후보 확인
     */

    if(
        value === quantityCandidate
    ){

        quantityCount++;

    }else{

        quantityCandidate =
            value;

        quantityCount =
            1;

    }


    document
        .getElementById(
            "cameraStatus"
        )
        .textContent =

        "Quantity 확인 " +

        Math.min(
            quantityCount,
            QTY_CONFIRM
        ) +

        "/" +

        QTY_CONFIRM;


    /*
     * 최종
     */

    if(
        quantityCount >=
        QTY_CONFIRM
    ){

        quantity =
            value;


        finishScan();

    }

}


/* =========================================================
   완료
========================================================= */

function finishScan(){

    ocrRunning =
        false;


    scanning =
        false;


    clearTimeout(
        quantityTimer
    );


    /*
     * 카메라 종료
     */

    stopScanner();


    /*
     * 결과 표시
     */

    document
        .getElementById(
            "materialResult"
        )
        .textContent =
        partNumber;


    document
        .getElementById(
            "quantityResult"
        )
        .textContent =
        quantity;


    document
        .getElementById(
            "result"
        )
        .style.display =
        "block";


    setStatus(
        "✅ 부품번호 + Quantity 인식 완료",
        "success"
    );

}


/* =========================================================
   줌
========================================================= */

async function zoomIn(){

    if(
        !currentTrack ||
        maxZoom <= minZoom
    ){

        return;

    }


    currentZoom =
        Math.min(
            currentZoom + .5,
            maxZoom
        );


    await applyZoom();

}


async function zoomOut(){

    if(
        !currentTrack ||
        maxZoom <= minZoom
    ){

        return;

    }


    currentZoom =
        Math.max(
            currentZoom - .5,
            minZoom
        );


    await applyZoom();

}


async function applyZoom(){

    if(!currentTrack){

        return;

    }


    try{

        await currentTrack
            .applyConstraints({

                advanced:[
                    {
                        zoom:
                            currentZoom
                    }
                ]

            });

    }catch(e){}

}


/* =========================================================
   조명
========================================================= */

async function toggleTorch(){

    if(!currentTrack){

        return;

    }


    try{

        const caps =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};


        if(!caps.torch){

            setStatus(
                "이 휴대폰에서는 웹 조명을 지원하지 않습니다.",
                "warning"
            );

            return;

        }


        torchOn =
            !torchOn;


        await currentTrack
            .applyConstraints({

                advanced:[
                    {
                        torch:
                            torchOn
                    }
                ]

            });

    }catch(e){}

}


/* =========================================================
   스캐너 종료
========================================================= */

function stopScanner(){

    try{

        Quagga.stop();

    }catch(e){}


    scannerRunning =
        false;


    try{

        if(currentTrack){

            currentTrack.stop();

        }

    }catch(e){}


    currentTrack =
        null;


    document
        .getElementById(
            "scannerBox"
        )
        .style.display =
        "none";


    /*
     * 후보 초기화는
     * 완료 결과를 유지해야 하므로
     * partNumber / quantity는 유지
     */

    barcodeCandidate =
        "";

    barcodeCount =
        0;


    /*
     * Quantity OCR 중이었다면
     * 타이머 종료
     */

    clearTimeout(
        quantityTimer
    );

    quantityTimer =
        null;

}

function manualSearch(){

    const p =
        document
            .getElementById(
                "manualPart"
            )
            .value
            .trim()
            .toUpperCase();


    const q =
        document
            .getElementById(
                "manualQuantity"
            )
            .value
            .trim();


    if(
        p.length !==
        PART_LENGTH
    ){

        setStatus(
            "부품번호는 뒤 9자리로 입력해주세요.",
            "error"
        );

        return;

    }


    if(
        !q ||
        Number(q) <= 0
    ){

        setStatus(
            "Quantity를 입력해주세요.",
            "error"
        );

        return;

    }


    partNumber =
        p;

    quantity =
        Number(q);


    document
        .getElementById(
            "materialResult"
        )
        .textContent =
        partNumber;


    document
        .getElementById(
            "quantityResult"
        )
        .textContent =
        quantity;


    document
        .getElementById(
            "result"
        )
        .style.display =
        "block";


    setStatus(
        "✅ 입력 완료",
        "success"
    );

}
