<script>

/* =========================================================
   설정
========================================================= */


/*
 * Material No. 자리수
 */
const MATERIAL_LENGTH = 11;


/*
 * OCR 연속 확인 횟수
 *
 * 한 번 잘못 인식된 값을 바로 확정하지 않는다.
 */
const REQUIRED_CONFIRMATIONS = 2;


/*
 * OCR 반복 간격
 *
 * 너무 자주 OCR을 돌리면 휴대폰이 느려지므로
 * 1.2초 정도 간격으로 실행
 */
const OCR_INTERVAL = 1200;


/*
 * 이미 읽은 번호 재처리 방지
 */
const ACCEPT_BLOCK_TIME = 4000;


/* =========================================================
   상태 변수
========================================================= */

let stream = null;

let video = null;

let scanning = false;

let processingOCR = false;

let ocrTimer = null;


/*
 * 카메라
 */
let currentTrack = null;

let currentZoom = 1;

let minZoom = 1;

let maxZoom = 1;

let torchOn = false;


/*
 * OCR 후보
 */
let candidate = "";

let candidateCount = 0;

let candidateStart = 0;


/*
 * 최종 확정
 */
let lastAccepted = "";

let lastAcceptedTime = 0;


/*
 * Tesseract Worker
 */
let worker = null;

let workerReady = false;


/* =========================================================
   상태
========================================================= */

function setStatus(
    text,
    type = ""
){

    const el =
        document.getElementById(
            "status"
        );

    el.textContent =
        text;

    el.className =
        "status";


    if(type){

        el.classList.add(
            type
        );

    }

}


/* =========================================================
   스캔 후보 초기화
========================================================= */

function resetCandidate(){

    candidate = "";

    candidateCount = 0;

    candidateStart = 0;

}


/* =========================================================
   숫자 정리
========================================================= */

function normalizeDigits(text){

    if(
        text === null ||
        text === undefined
    ){

        return "";

    }


    /*
     * OCR에서 자주 틀리는 문자들을
     * 숫자로 보정
     *
     * O → 0
     * I/l → 1
     * S → 5
     * B → 8
     * Z → 2
     */
    let value =
        String(text)

            .replace(
                /O/gi,
                "0"
            )

            .replace(
                /I/gi,
                "1"
            )

            .replace(
                /L/gi,
                "1"
            )

            .replace(
                /S/gi,
                "5"
            )

            .replace(
                /B/gi,
                "8"
            )

            .replace(
                /Z/gi,
                "2"
            );


    /*
     * 공백 / 하이픈 등을 제거
     */
    value =
        value.replace(
            /[^0-9]/g,
            ""
        );


    return value;

}


/* =========================================================
   Material No. 후보 생성
========================================================= */

function extractMaterialCandidates(
    text
){

    const candidates = [];


    if(!text){

        return candidates;

    }


    /*
     * 줄 단위로 나누기
     */
    const lines =
        String(text)
            .split(/\r?\n/)
            .map(
                line =>
                    line.trim()
            )
            .filter(
                line => line.length > 0
            );


    /*
     * -----------------------------------------------------
     * 1차:
     * Material / Material No. 줄을 최우선 분석
     * -----------------------------------------------------
     */

    for(
        const line of lines
    ){

        const lower =
            line.toLowerCase();


        const hasMaterial =
            lower.includes(
                "material"
            ) ||
            lower.includes(
                "mat"
            );


        if(!hasMaterial){

            continue;

        }


        const normalized =
            normalizeDigits(line);


        /*
         * 정확히 11자리
         */

        if(
            normalized.length ===
            MATERIAL_LENGTH
        ){

            candidates.push(
                normalized
            );

        }


        /*
         * 줄 안에 공백으로 분리된 숫자들이 있는 경우
         *
         * 예:
         *
         * 07 11 9 905 147
         */

        const groups =
            line.match(
                /\d+/g
            );


        if(groups){

            const grouped =
                groups.join("");


            if(
                grouped.length ===
                MATERIAL_LENGTH
            ){

                candidates.push(
                    grouped
                );

            }

        }

    }


    /*
     * -----------------------------------------------------
     * 2차:
     * OCR 전체 텍스트에서
     * 11자리 숫자가 있는 줄만 확인
     *
     * ★ 여기서는 숫자를 잘라내지 않는다.
     * 정확히 11자리인 경우만 인정한다.
     * -----------------------------------------------------
     */

    for(
        const line of lines
    ){

        const digits =
            normalizeDigits(line);


        if(
            digits.length ===
            MATERIAL_LENGTH
        ){

            candidates.push(
                digits
            );

        }

    }


    /*
     * -----------------------------------------------------
     * 3차:
     * 그룹 숫자 합치기
     *
     * 예:
     * 07 11 9 905 147
     *
     * → 07119905147
     *
     * 단, 한 줄에서만 처리
     * -----------------------------------------------------
     */

    for(
        const line of lines
    ){

        const groups =
            line.match(
                /\d+/g
            );


        if(
            !groups ||
            groups.length < 2
        ){

            continue;

        }


        /*
         * 너무 긴 숫자를 억지로 자르지 않는다.
         */

        const joined =
            groups.join("");


        if(
            joined.length ===
            MATERIAL_LENGTH
        ){

            candidates.push(
                joined
            );

        }

    }


    /*
     * 중복 제거
     */

    return [
        ...new Set(
            candidates
        )
    ];

}


/* =========================================================
   OCR 전처리
========================================================= */


/*
 * 카메라 전체 화면에서
 * Material No. 가 있을 것으로 예상되는
 * 중앙 영역만 잘라낸다.
 *
 * 이게 Quantity / Location을
 * 제외하는 핵심이다.
 */

function captureOCRCanvas(){

    if(
        !video ||
        video.readyState < 2
    ){

        return null;

    }


    const videoWidth =
        video.videoWidth;

    const videoHeight =
        video.videoHeight;


    if(
        !videoWidth ||
        !videoHeight
    ){

        return null;

    }


    /*
     * 화면 가이드와 비슷한 중앙 영역
     */

    const cropX =
        Math.round(
            videoWidth * 0.04
        );


    const cropWidth =
        Math.round(
            videoWidth * 0.92
        );


    /*
     * Material No. 줄을
     * 화면 중앙 위쪽 정도에서 가져온다.
     *
     * 너무 넓게 잡으면
     * Quantity / Location이 같이 들어올 수 있다.
     */

    const cropY =
        Math.round(
            videoHeight * 0.28
        );


    const cropHeight =
        Math.round(
            videoHeight * 0.24
        );


    /*
     * 2배 확대해서 OCR
     */

    const scale = 2.5;


    const canvas =
        document.createElement(
            "canvas"
        );


    canvas.width =
        Math.round(
            cropWidth * scale
        );


    canvas.height =
        Math.round(
            cropHeight * scale
        );


    const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


    /*
     * 흑백 변환을 위한 원본
     */

    ctx.drawImage(
        video,

        cropX,
        cropY,
        cropWidth,
        cropHeight,

        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
     * 이미지 대비 증가
     */

    const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


    const data =
        imageData.data;


    for(
        let i = 0;
        i < data.length;
        i += 4
    ){

        const r = data[i];

        const g = data[i + 1];

        const b = data[i + 2];


        /*
         * 회색 변환
         */
        let gray =
            0.299 * r +
            0.587 * g +
            0.114 * b;


        /*
         * 대비 강화
         */
        gray =
            (gray - 128) * 1.7 + 128;


        gray =
            Math.max(
                0,
                Math.min(
                    255,
                    gray
                )
            );


        data[i] =
            gray;

        data[i + 1] =
            gray;

        data[i + 2] =
            gray;

    }


    ctx.putImageData(
        imageData,
        0,
        0
    );


    return canvas;

}


/* =========================================================
   Tesseract 준비
========================================================= */

async function prepareOCR(){

    if(workerReady){

        return;

    }


    setStatus(
        "OCR 엔진을 준비하고 있습니다...",
        "warning"
    );


    try{

        /*
         * Tesseract Worker 생성
         */
        worker =
            await Tesseract.createWorker(
                "eng",
                1,
                {
                    logger:
                        function(message){

                            if(
                                message &&
                                message.status
                            ){

                                const progress =
                                    message.progress
                                        ? Math.round(
                                            message.progress * 100
                                          )
                                        : 0;


                                if(
                                    message.status
                                    ===
                                    "recognizing text"
                                ){

                                    document
                                        .getElementById(
                                            "cameraStatus"
                                        )
                                        .textContent =
                                        "문자 인식 중 " +
                                        progress +
                                        "%";

                                }

                            }

                        }
                }
            );


        /*
         * 숫자 인식에 유리하도록
         * 페이지 분할 모드 설정
         */
        await worker.setParameters({

            tessedit_pageseg_mode:
                "6",

            preserve_interword_spaces:
                "1"

        });


        workerReady =
            true;


    }catch(error){

        console.error(
            "OCR Worker error:",
            error
        );


        workerReady =
            false;

        throw error;

    }

}


/* =========================================================
   OCR 시작
========================================================= */

async function startOCR(){

    if(scanning){

        return;

    }


    resetCandidate();


    lastAccepted =
        "";

    lastAcceptedTime =
        0;


    document
        .getElementById(
            "cameraBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "manualBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "result"
        )
        .innerHTML =
        "";


    document
        .getElementById(
            "ocrBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "candidateBox"
        )
        .style.display =
        "none";


    setStatus(
        "카메라를 준비하고 있습니다...",
        "warning"
    );


    try{

        /*
         * 카메라
         */

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:{
                            ideal:"environment"
                        },

                        width:{
                            ideal:1920
                        },

                        height:{
                            ideal:1080
                        }

                    },

                    audio:false

                });


        video =
            document.getElementById(
                "video"
            );


        video.srcObject =
            stream;


        await video.play();


        currentTrack =
            stream.getVideoTracks()[0];


        setupCamera();


        /*
         * OCR 엔진 준비
         */

        await prepareOCR();


        scanning =
            true;


        document
            .getElementById(
                "cameraStatus"
            )
            .textContent =
            "Material No. 줄을 찾는 중...";


        setStatus(
            "Material No. 줄을 사각형 안에 맞춰주세요.",
            "warning"
        );


        /*
         * OCR 반복 시작
         */

        scheduleOCR();


    }catch(error){

        console.error(
            error
        );


        stopOCR();


        setStatus(
            "카메라 또는 OCR을 시작하지 못했습니다.",
            "error"
        );


        document
            .getElementById(
                "manualBox"
            )
            .style.display =
            "block";

    }

}


/* =========================================================
   OCR 반복 예약
========================================================= */

function scheduleOCR(){

    if(!scanning){

        return;

    }


    clearTimeout(
        ocrTimer
    );


    ocrTimer =
        setTimeout(
            runOCR,
            OCR_INTERVAL
        );

}


/* =========================================================
   OCR 실행
========================================================= */

async function runOCR(){

    if(
        !scanning ||
        processingOCR ||
        !workerReady
    ){

        scheduleOCR();

        return;

    }


    processingOCR =
        true;


    try{

        document
            .getElementById(
                "cameraStatus"
            )
            .textContent =
            "Material No. 인식 중...";


        /*
         * OCR용 이미지
         */
        const canvas =
            captureOCRCanvas();


        if(!canvas){

            processingOCR =
                false;

            scheduleOCR();

            return;

        }


        /*
         * OCR
         */
        const result =
            await worker.recognize(
                canvas
            );


        const text =
            result &&
            result.data
                ? result.data.text
                : "";


        /*
         * OCR 결과 화면 표시
         */

        showOCRText(
            text
        );


        /*
         * 후보 추출
         */

        const candidates =
            extractMaterialCandidates(
                text
            );


        /*
         * 후보 처리
         */

        if(
            candidates.length
        ){

            processCandidate(
                candidates
            );

        }else{

            document
                .getElementById(
                    "cameraStatus"
                )
                .textContent =
                "Material No.를 찾는 중...";

        }


    }catch(error){

        console.error(
            "OCR error:",
            error
        );

    }


    processingOCR =
        false;


    scheduleOCR();

}


/* =========================================================
   OCR 텍스트 표시
========================================================= */

function showOCRText(text){

    const box =
        document.getElementById(
            "ocrBox"
        );


    box.style.display =
        "block";


    document
        .getElementById(
            "ocrText"
        )
        .textContent =
        text ||
        "(인식된 문자가 없습니다)";

}


/* =========================================================
   후보 처리
========================================================= */

function processCandidate(
    candidates
){

    const now =
        Date.now();


    /*
     * 첫 번째 후보
     *
     * Material No. 줄을 우선순위로 가져왔음
     */

    const value =
        candidates[0];


    if(!value){

        return;

    }


    /*
     * 혹시 잘못된 후보 방지
     */
    if(
        !/^\d{11}$/.test(
            value
        )
    ){

        return;

    }


    /*
     * 이전 후보와 동일
     */

    if(
        value === candidate &&
        now - candidateStart < 3000
    ){

        candidateCount++;

    }else{

        candidate =
            value;

        candidateCount =
            1;

        candidateStart =
            now;

    }


    /*
     * 표시
     */

    document
        .getElementById(
            "candidateBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "candidateNumber"
        )
        .textContent =
        value;


    document
        .getElementById(
            "cameraStatus"
        )
        .textContent =

        "11자리 확인 " +

        Math.min(
            candidateCount,
            REQUIRED_CONFIRMATIONS
        ) +

        "/" +

        REQUIRED_CONFIRMATIONS;


    /*
     * 2회 연속 동일하면 확정
     */

    if(
        candidateCount >=
        REQUIRED_CONFIRMATIONS
    ){

        /*
         * 중복 방지
         */

        if(
            value === lastAccepted &&
            now - lastAcceptedTime <
            ACCEPT_BLOCK_TIME
        ){

            return;

        }


        lastAccepted =
            value;

        lastAcceptedTime =
            now;


        acceptMaterialNo(
            value
        );

    }

}


/* =========================================================
   최종 확정
========================================================= */

function acceptMaterialNo(
    materialNo
){

    stopOCR();


    document
        .getElementById(
            "candidateBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "candidateNumber"
        )
        .textContent =
        materialNo;


    setStatus(
        "✅ Material No. 인식 완료: " +
        materialNo,
        "success"
    );


    /*
     * 실제 데이터 조회
     */
    lookupPart(
        materialNo
    );

}


/* =========================================================
   카메라 설정
========================================================= */

function setupCamera(){

    if(!currentTrack){

        return;

    }


    try{

        const caps =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};


        /*
         * 줌
         */

        if(caps.zoom){

            minZoom =
                caps.zoom.min || 1;

            maxZoom =
                caps.zoom.max || 1;


            /*
             * 시작 줌
             */
            currentZoom =
                Math.min(
                    Math.max(
                        1.5,
                        minZoom
                    ),
                    maxZoom
                );


            applyZoom();

        }


        /*
         * 자동초점
         */

        if(caps.focusMode){

            if(
                caps.focusMode
                    .includes(
                        "continuous"
                    )
            ){

                currentTrack
                    .applyConstraints({

                        advanced:[
                            {
                                focusMode:
                                    "continuous"
                            }
                        ]

                    })
                    .catch(
                        () => {}
                    );

            }

        }

    }catch(error){

        console.log(
            error
        );

    }

}


/* =========================================================
   줌 +
========================================================= */

async function zoomIn(){

    if(
        !currentTrack ||
        maxZoom <= minZoom
    ){

        return;

    }


    currentZoom =
        Math.min(
            currentZoom + .5,
            maxZoom
        );


    await applyZoom();

}


/* =========================================================
   줌 -
========================================================= */

async function zoomOut(){

    if(
        !currentTrack ||
        maxZoom <= minZoom
    ){

        return;

    }


    currentZoom =
        Math.max(
            currentZoom - .5,
            minZoom
        );


    await applyZoom();

}


/* =========================================================
   줌 적용
========================================================= */

async function applyZoom(){

    if(!currentTrack){

        return;

    }


    try{

        await currentTrack
            .applyConstraints({

                advanced:[
                    {
                        zoom:
                            currentZoom
                    }
                ]

            });

    }catch(error){

        console.log(
            error
        );

    }

}


/* =========================================================
   손전등
========================================================= */

async function toggleTorch(){

    if(!currentTrack){

        return;

    }


    try{

        const caps =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};


        if(!caps.torch){

            setStatus(
                "이 휴대폰에서는 웹 조명을 지원하지 않습니다.",
                "warning"
            );

            return;

        }


        torchOn =
            !torchOn;


        await currentTrack
            .applyConstraints({

                advanced:[
                    {
                        torch:
                            torchOn
                    }
                ]

            });

    }catch(error){

        console.log(
            error
        );

    }

}


/* =========================================================
   OCR 종료
========================================================= */

function stopOCR(){

    scanning =
        false;


    processingOCR =
        false;


    clearTimeout(
        ocrTimer
    );


    ocrTimer =
        null;


    /*
     * 카메라 종료
     */

    try{

        if(stream){

            stream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }catch(e){}


    try{

        if(video){

            video.pause();

            video.srcObject =
                null;

        }

    }catch(e){}


    stream =
        null;

    video =
        null;

    currentTrack =
        null;


    /*
     * UI
     */

    document
        .getElementById(
            "cameraBox"
        )
        .style.display =
        "none";


    resetCandidate();

}


/* =========================================================
   수동 조회
========================================================= */

function manualSearch(){

    const input =
        document.getElementById(
            "manualBarcode"
        );


    const raw =
        input.value.trim();


    const cleaned =
        normalizeDigits(
            raw
        );


    if(
        !/^\d{11}$/.test(
            cleaned
        )
    ){

        setStatus(
            "Material No.는 정확히 11자리 숫자로 입력해주세요.",
            "error"
        );

        return;

    }


    input.value =
        cleaned;


    lookupPart(
        cleaned
    );

}


/* =========================================================
   부품 조회
========================================================= */

function lookupPart(
    partNo
){

    partNo =
        String(
            partNo || ""
        ).trim();


    if(!partNo){

        return;

    }


    document
        .getElementById(
            "loading"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "result"
        )
        .innerHTML =
        "";


    setStatus(
        "부품 정보를 조회하고 있습니다...",
        "warning"
    );


    /*
     * Google Apps Script 환경에서 실행할 경우
     */
    if(
        typeof google !== "undefined" &&
        google.script &&
        google.script.run
    ){

        google.script.run

            .withSuccessHandler(
                function(data){

                    document
                        .getElementById(
                            "loading"
                        )
                        .style.display =
                        "none";


                    displayPart(
                        data
                    );

                }
            )

            .withFailureHandler(
                function(error){

                    document
                        .getElementById(
                            "loading"
                        )
                        .style.display =
                        "none";


                    console.error(
                        error
                    );


                    setStatus(
                        "부품 조회 중 오류가 발생했습니다.",
                        "error"
                    );

                }
            )

            .getPart(
                partNo
            );


        return;

    }


    /*
     * GitHub Pages 자체에서는
     * 인식된 번호 표시
     *
     * 실제 재고 API가 연결되어 있다면
     * 이 부분에서 API를 호출한다.
     */

    displayPart({

        partNo:
            partNo

    });

}


/* =========================================================
   결과 출력
========================================================= */

function displayPart(
    data
){

    document
        .getElementById(
            "loading"
        )
        .style.display =
        "none";


    if(!data){

        setStatus(
            "등록된 부품을 찾지 못했습니다.",
            "error"
        );

        return;

    }


    const partNo =
        data.partNo ||
        data.partNumber ||
        data.materialNo ||
        data["부품번호"] ||
        "";


    const name =
        data.name ||
        data.partName ||
        data.description ||
        data["품명"] ||
        "";


    const spec =
        data.spec ||
        data.specification ||
        data["규격"] ||
        "";


    const stock =
        data.stock ??
        data.currentStock ??
        data["현재고"] ??
        "";


    const location =
        data.location ||
        data.currentLocation ||
        data["현재 로케이션"] ||
        "";


    const assignedLocation =
        data.assignedLocation ||
        data.designatedLocation ||
        data["지정 로케이션"] ||
        "";


    document
        .getElementById(
            "result"
        )
        .innerHTML = `

            <div class="card">

                <div class="result-row">

                    <div class="label">
                        Material No.
                    </div>

                    <div class="value">
                        ${escapeHtml(partNo)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        품명
                    </div>

                    <div class="value">
                        ${escapeHtml(name)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        규격
                    </div>

                    <div class="value">
                        ${escapeHtml(spec)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        현재고
                    </div>

                    <div class="value">
                        ${escapeHtml(stock)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        현재 로케이션
                    </div>

                    <div class="value">
                        ${escapeHtml(location)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        지정 로케이션
                    </div>

                    <div class="value">
                        ${escapeHtml(
                            assignedLocation
                        )}
                    </div>

                </div>

            </div>

        `;


    if(
        !name &&
        !spec &&
        stock === "" &&
        !location
    ){

        setStatus(
            "✅ 11자리 Material No. 인식 완료",
            "success"
        );

    }else{

        setStatus(
            "✅ 부품 조회 완료",
            "success"
        );

    }

}


/* =========================================================
   HTML Escape
========================================================= */

function escapeHtml(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

   페이지 종료

    }
);
