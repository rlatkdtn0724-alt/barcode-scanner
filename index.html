<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>부품번호 수량 인식</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .wrap {
      max-width: 480px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin: 5px 0 20px;
    }

    .camera-button {
      display: block;
      width: 100%;
      padding: 18px;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }

    #photoInput {
      display: none;
    }

    .result-box {
      margin-top: 20px;
      background: white;
      padding: 18px;
      border-radius: 10px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #bbb;
      border-radius: 8px;
      font-size: 19px;
      background: white;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      color: #666;
      font-size: 14px;
      white-space: pre-wrap;
    }

    #preview {
      display: none;
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h2>부품번호 / 수량</h2>

  <label for="photoInput" class="camera-button">
    📷 촬영하기
  </label>

  <input
    id="photoInput"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <img id="preview" alt="촬영한 사진">

  <div class="result-box">

    <div class="field">
      <div class="field-title">부품번호</div>
      <input
        id="partNumber"
        type="text"
        placeholder="부품번호"
        autocomplete="off"
      >
    </div>

    <div class="field">
      <div class="field-title">수량</div>
      <input
        id="quantity"
        type="number"
        min="1"
        inputmode="numeric"
        placeholder="수량"
      >
    </div>

  </div>

  <div id="status">
    촬영하기를 눌러주세요.
  </div>

</div>

<script>
  const photoInput = document.getElementById("photoInput");
  const preview = document.getElementById("preview");
  const partNumber = document.getElementById("partNumber");
  const quantity = document.getElementById("quantity");
  const status = document.getElementById("status");

  photoInput.addEventListener("change", async function () {
    const file = photoInput.files[0];

    if (!file) {
      return;
    }

    preview.src = URL.createObjectURL(file);
    preview.style.display = "none";

    partNumber.value = "";
    quantity.value = "";

    status.textContent = "인식 중...";

    try {
      const result = await Tesseract.recognize(
        file,
        "eng",
        {
          logger: function (info) {
            if (info.status === "recognizing text") {
              status.textContent =
                "인식 중... " +
                Math.round(info.progress * 100) +
                "%";
            }
          }
        }
      );

      const text = cleanText(result.data.text);

      console.log("OCR 결과:", text);

      const foundPartNumber = findPartNumber(text);
      const foundQuantity = findQuantity(text);

      partNumber.value = foundPartNumber;
      quantity.value = foundQuantity;

      if (foundPartNumber && foundQuantity) {
        status.textContent = "인식 완료";
      } else if (!foundPartNumber && !foundQuantity) {
        status.textContent =
          "인식 실패\n부품번호와 QUANTITY가 크게 보이도록 다시 촬영해 주세요.";
      } else if (!foundPartNumber) {
        status.textContent =
          "부품번호를 인식하지 못했습니다.";
      } else {
        status.textContent =
          "QUANTITY 옆 수량을 인식하지 못했습니다.";
      }

    } catch (error) {
      console.error(error);

      status.textContent =
        "인식 오류가 발생했습니다.";
    }

    photoInput.value = "";
  });

  function cleanText(text) {
    return String(text)
      .toUpperCase()
      .replace(/[|]/g, "I")
      .replace(/[\r\n]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function findPartNumber(text) {
    /*
      영문+숫자가 섞인 부품번호 찾기
      바코드 숫자만 있는 값은 제외
    */

    const candidates = text.match(/[A-Z0-9]{8,15}/g);

    if (!candidates) {
      return "";
    }

    const excluded = [
      "QUANTITY",
      "PARTNUMBER",
      "PARTNO",
      "PARTNUM",
      "DESCRIPTION",
      "LOCATION",
      "PRODUCT",
      "SUPPLIER",
      "COUNTRY",
      "GERMANY",
      "BMW"
    ];

    for (const value of candidates) {
      if (excluded.includes(value)) {
        continue;
      }

      if (/^\d+$/.test(value)) {
        continue;
      }

      if (/[A-Z]/.test(value) && /\d/.test(value)) {
        return value;
      }
    }

    return "";
  }

  function findQuantity(text) {
    /*
      QUANTITY 바로 옆 숫자만 추출

      QUANTITY 5
      QUANTITY: 5
      QUANTITY-5
    */

    const match = text.match(
      /QUANTITY\s*[:\-]?\s*(\d{1,5})/i
    );

    if (match) {
      return match[1];
    }

    return "";
  }
</script>

</body>
</html>
