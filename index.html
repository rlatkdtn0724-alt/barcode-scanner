<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>부품번호 수량 인식</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
    }

    .box {
      background: white;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    button {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      font-size: 17px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #bbb;
      background: white;
    }

    button {
      margin-top: 12px;
      border: none;
      background: #222;
      color: white;
      font-weight: bold;
    }

    button:disabled {
      background: #999;
    }

    #preview {
      display: none;
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 8px;
      background: #eee;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #eee;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .help {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h2>부품번호 + 수량 인식</h2>

  <div class="box">

    <label for="photoInput">태그 사진 촬영</label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <img id="preview" alt="촬영한 태그 사진">

    <button id="readButton" disabled>
      부품번호와 수량 읽기
    </button>

    <div class="help">
      바코드는 읽지 않습니다.<br>
      사진 속 부품번호 글자와 QUANTITY 옆 숫자만 인식합니다.
    </div>

  </div>

  <div class="box">

    <label for="partNumber">부품번호</label>
    <input
      id="partNumber"
      type="text"
      placeholder="부품번호"
      autocomplete="off"
    >

    <label for="quantity">수량</label>
    <input
      id="quantity"
      type="number"
      min="1"
      inputmode="numeric"
      placeholder="수량"
    >

    <button id="copyButton">
      부품번호 + 수량 복사
    </button>

  </div>

  <div id="status">
    사진을 촬영해 주세요.
  </div>

  <script>
    const photoInput = document.getElementById("photoInput");
    const preview = document.getElementById("preview");
    const readButton = document.getElementById("readButton");
    const partNumber = document.getElementById("partNumber");
    const quantity = document.getElementById("quantity");
    const copyButton = document.getElementById("copyButton");
    const status = document.getElementById("status");

    let selectedFile = null;

    photoInput.addEventListener("change", function () {
      selectedFile = photoInput.files[0];

      if (!selectedFile) {
        readButton.disabled = true;
        preview.style.display = "none";
        status.textContent = "사진을 촬영해 주세요.";
        return;
      }

      const imageUrl = URL.createObjectURL(selectedFile);

      preview.src = imageUrl;
      preview.style.display = "block";
      readButton.disabled = false;

      partNumber.value = "";
      quantity.value = "";

      status.textContent =
        "사진 준비 완료\n" +
        "아래 버튼을 눌러 부품번호와 수량을 읽어 주세요.";
    });

    readButton.addEventListener("click", async function () {
      if (!selectedFile) {
        alert("사진을 먼저 촬영해 주세요.");
        return;
      }

      readButton.disabled = true;
      status.textContent = "글자 인식 준비 중...";

      try {
        const result = await Tesseract.recognize(
          selectedFile,
          "eng",
          {
            logger: function (info) {
              if (info.status === "recognizing text") {
                const percent = Math.round(info.progress * 100);

                status.textContent =
                  "글자 인식 중...\n" +
                  percent +
                  "%";
              }
            }
          }
        );

        const originalText = result.data.text;

        console.log("OCR 원본 결과:");
        console.log(originalText);

        const cleanedText = cleanText(originalText);

        console.log("정리된 OCR 결과:");
        console.log(cleanedText);

        const detectedPartNumber = findPartNumber(cleanedText);
        const detectedQuantity = findQuantity(cleanedText);

        partNumber.value = detectedPartNumber;
        quantity.value = detectedQuantity;

        if (detectedPartNumber && detectedQuantity) {
          status.textContent =
            "인식 완료\n\n" +
            "부품번호: " + detectedPartNumber + "\n" +
            "수량: " + detectedQuantity;
        } else if (detectedPartNumber) {
          status.textContent =
            "부품번호는 인식했지만 수량을 찾지 못했습니다.\n\n" +
            "QUANTITY 옆 숫자가 잘 보이도록 다시 촬영해 주세요.";
        } else if (detectedQuantity) {
          status.textContent =
            "수량은 인식했지만 부품번호를 찾지 못했습니다.\n\n" +
            "부품번호 글자가 크게 보이도록 다시 촬영해 주세요.";
        } else {
          status.textContent =
            "부품번호와 수량을 인식하지 못했습니다.\n\n" +
            "태그를 가까이에서 흔들리지 않게 다시 촬영해 주세요.";
        }

      } catch (error) {
        console.error("OCR 오류:", error);

        status.textContent =
          "글자 인식 중 오류가 발생했습니다.\n" +
          error.message;
      }

      readButton.disabled = false;
    });

    function cleanText(text) {
      return String(text)
        .toUpperCase()
        .replace(/[|]/g, "I")
        .replace(/[\r\n]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function findPartNumber(text) {
      /*
        부품번호 후보:
        영문과 숫자가 섞인 8~15자리
        바코드 숫자만 있는 값은 제외
      */

      const candidates = text.match(/[A-Z0-9]{8,15}/g);

      if (!candidates) {
        return "";
      }

      const excludedWords = [
        "QUANTITY",
        "PARTNUMBER",
        "PARTNO",
        "PARTNUM",
        "DESCRIPTION",
        "LOCATION",
        "PRODUCT",
        "BMW",
        "MIN",
        "MAX"
      ];

      for (const candidate of candidates) {
        if (excludedWords.includes(candidate)) {
          continue;
        }

        // 숫자만 있는 값은 바코드나 날짜일 가능성이 높으므로 제외
        if (/^\d+$/.test(candidate)) {
          continue;
        }

        // 영문과 숫자가 모두 포함된 값을 부품번호로 사용
        if (/[A-Z]/.test(candidate) && /\d/.test(candidate)) {
          return candidate;
        }
      }

      return "";
    }

    function findQuantity(text) {
      /*
        QUANTITY 옆 숫자만 인식

        인식 예시:
        QUANTITY 5
        QUANTITY: 5
        QUANTITY-5
        QUANTITY    12
      */

      const match = text.match(
        /QUANTITY\s*[:\-]?\s*(\d{1,5})/i
      );

      if (match) {
        return match[1];
      }

      return "";
    }

    copyButton.addEventListener("click", async function () {
      const part = partNumber.value.trim();
      const qty = quantity.value.trim();

      if (!part) {
        alert("부품번호를 확인해 주세요.");
        return;
      }

      if (!qty) {
        alert("수량을 확인해 주세요.");
        return;
      }

      const copyText = part + "\t" + qty;

      try {
        await navigator.clipboard.writeText(copyText);

        status.textContent =
          "복사 완료\n\n" +
          "부품번호: " + part + "\n" +
          "수량: " + qty;

      } catch (error) {
        alert(copyText);
      }
    });
  </script>

</body>
</html>
