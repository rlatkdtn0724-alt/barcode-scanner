<script>


/* =========================================================
   설정
========================================================= */


/*
 * Material No.는 정확히 11자리
 */
const MATERIAL_LENGTH = 11;


/*
 * 같은 값이 여러 번 확인되어야 확정
 *
 * 잘못 읽은 값이 한 번 튀는 것을 방지
 */
const CONFIRM_COUNT = 3;


/*
 * 같은 번호가 연속으로 확인되어야 하는 시간
 */
const CONFIRM_WINDOW = 2200;


/* =========================================================
   ZXing
========================================================= */

let codeReader = null;

let controls = null;

let scannerRunning = false;


/* =========================================================
   카메라
========================================================= */

let currentTrack = null;

let currentZoom = 1;

let minZoom = 1;

let maxZoom = 1;

let torchOn = false;


/* =========================================================
   후보
========================================================= */

let candidateCode = "";

let candidateCount = 0;

let candidateStartTime = 0;


/* =========================================================
   마지막 확정
========================================================= */

let lastAcceptedCode = "";

let lastAcceptedTime = 0;


/* =========================================================
   상태
========================================================= */

function setStatus(
    message,
    type = ""
){

    const el =
        document.getElementById(
            "status"
        );

    el.textContent =
        message;

    el.className =
        "status";

    if(type){

        el.classList.add(type);

    }

}


/* =========================================================
   원본 표시
========================================================= */

function showDebugValue(
    raw,
    cleaned
){

    const box =
        document.getElementById(
            "debugBox"
        );

    box.style.display =
        "block";


    document
        .getElementById(
            "debugValue"
        )
        .textContent =
        raw;


    document
        .getElementById(
            "debugClean"
        )
        .textContent =
        "숫자만 정리: " +
        cleaned;

}


/* =========================================================
   Material No. 검사
========================================================= */

function getExactMaterialNo(
    raw
){

    if(
        raw === null ||
        raw === undefined
    ){

        return null;

    }


    let text =
        String(raw)
            .trim();


    if(!text){

        return null;

    }


    /*
     * 바코드가 숫자 사이에
     * 공백 / 하이픈을 넣어 반환하는 경우 허용
     *
     * 예:
     * 07 11 9 905 147
     *
     * →
     * 07119905147
     */

    const cleaned =
        text.replace(
            /[\s-]/g,
            ""
        );


    /*
     * ★ 여기서 매우 중요
     *
     * 숫자 이외의 문자가 있으면 실패
     *
     * ABC07119905147
     * → 실패
     *
     * 07119905147XYZ
     * → 실패
     */

    if(
        !/^\d+$/.test(
            cleaned
        )
    ){

        return null;

    }


    /*
     * ★ 정확히 11자리
     *
     * 6자리 243183
     * → 실패
     *
     * 10자리
     * → 실패
     *
     * 12자리
     * → 실패
     */

    if(
        cleaned.length !==
        MATERIAL_LENGTH
    ){

        return null;

    }


    return cleaned;

}


/* =========================================================
   후보 초기화
========================================================= */

function resetCandidate(){

    candidateCode =
        "";

    candidateCount =
        0;

    candidateStartTime =
        0;

}


/* =========================================================
   스캐너 시작
========================================================= */

async function startScanner(){

    if(scannerRunning){

        return;

    }


    /*
     * 상태 초기화
     */

    resetCandidate();


    lastAcceptedCode =
        "";

    lastAcceptedTime =
        0;


    document
        .getElementById(
            "scannerBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "manualBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "result"
        )
        .innerHTML =
        "";


    document
        .getElementById(
            "debugBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "detectedBox"
        )
        .style.display =
        "none";


    setStatus(
        "카메라를 준비하고 있습니다...",
        "warning"
    );


    /*
     * ZXing 존재 확인
     */

    if(
        typeof ZXingBrowser ===
        "undefined"
    ){

        setStatus(
            "바코드 엔진을 불러오지 못했습니다.",
            "error"
        );

        return;

    }


    try{

        /*
         * MultiFormatReader
         *
         * 1D 바코드 형식들을 자동으로 판독
         */
        codeReader =
            new ZXingBrowser.BrowserMultiFormatReader();


        /*
         * 카메라 목록
         */

        const devices =
            await ZXingBrowser
                .BrowserCodeReader
                .listVideoInputDevices();


        if(
            !devices ||
            !devices.length
        ){

            throw new Error(
                "카메라를 찾을 수 없습니다."
            );

        }


        /*
         * 후면 카메라 우선
         *
         * 휴대폰에서는 보통 label에
         * Back / Rear / Environment가 들어간다.
         */

        let selectedDevice =
            devices.find(
                device => {

                    const label =
                        String(
                            device.label ||
                            ""
                        ).toLowerCase();

                    return (
                        label.includes("back") ||
                        label.includes("rear") ||
                        label.includes("environment") ||
                        label.includes("후면")
                    );

                }
            );


        /*
         * 후면 카메라를 못 찾으면
         * 마지막 카메라 사용
         */

        if(!selectedDevice){

            selectedDevice =
                devices[devices.length - 1];

        }


        /*
         * 비디오
         */

        const video =
            document.getElementById(
                "video"
            );


        /*
         * 연속 디코딩
         */

        controls =
            await codeReader
                .decodeFromVideoDevice(

                    selectedDevice.deviceId,

                    video,

                    function(
                        result,
                        error,
                        controlsFromZXing
                    ){

                        /*
                         * 정상 결과가 있을 때만 처리
                         */
                        if(result){

                            processZXingResult(
                                result
                            );

                        }

                    }

                );


        scannerRunning =
            true;


        /*
         * 카메라 트랙 확인
         */

        setTimeout(
            setupCameraTrack,
            600
        );


        setStatus(
            "바코드를 사각형 안에 크게 맞춰주세요.",
            "warning"
        );


        document
            .getElementById(
                "scanProgress"
            )
            .textContent =
            "바코드를 찾는 중...";


    }catch(error){

        console.error(
            "ZXing scanner error:",
            error
        );


        scannerRunning =
            false;


        setStatus(
            "카메라를 시작하지 못했습니다. 카메라 권한을 확인해주세요.",
            "error"
        );


        document
            .getElementById(
                "manualBox"
            )
            .style.display =
            "block";

    }

}


/* =========================================================
   ZXing 결과 처리
========================================================= */

function processZXingResult(
    result
){

    if(!scannerRunning){

        return;

    }


    if(!result){

        return;

    }


    let raw = "";


    try{

        raw =
            result.getText();

    }catch(e){

        raw =
            result.text || "";

    }


    if(!raw){

        return;

    }


    /*
     * 디버깅
     */

    console.log(
        "ZXing RAW:",
        raw
    );


    console.log(
        "ZXing FORMAT:",
        result.getBarcodeFormat
            ? result.getBarcodeFormat()
            : "unknown"
    );


    /*
     * 숫자만 확인용
     */
    const cleaned =
        String(raw)
            .replace(
                /[\s-]/g,
                ""
            );


    showDebugValue(
        raw,
        cleaned
    );


    /*
     * ★ 정확히 11자리
     */
    const materialNo =
        getExactMaterialNo(
            raw
        );


    /*
     * 11자리 아니면 무시
     *
     * 예:
     * 243183
     * → 무시
     */

    if(!materialNo){

        document
            .getElementById(
                "scanProgress"
            )
            .textContent =
            "바코드는 읽었지만 11자리 Material No.가 아닙니다.";

        return;

    }


    /*
     * 현재 시각
     */

    const now =
        Date.now();


    /*
     * 같은 값이 일정 시간 동안
     * 반복적으로 확인되는지 검사
     */

    if(
        materialNo ===
        candidateCode &&

        now -
        candidateStartTime <=
        CONFIRM_WINDOW
    ){

        candidateCount++;

    }else{

        candidateCode =
            materialNo;

        candidateCount =
            1;

        candidateStartTime =
            now;

    }


    /*
     * 진행 표시
     */

    document
        .getElementById(
            "detectedBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "detectedNumber"
        )
        .textContent =
        materialNo;


    document
        .getElementById(
            "scanProgress"
        )
        .textContent =

            "11자리 확인 " +

            Math.min(
                candidateCount,
                CONFIRM_COUNT
            ) +

            "/" +

            CONFIRM_COUNT;


    /*
     * 최종 확정
     */

    if(
        candidateCount >=
        CONFIRM_COUNT
    ){

        /*
         * 중복 확정 방지
         */

        if(
            materialNo ===
            lastAcceptedCode &&

            now -
            lastAcceptedTime <
            3000
        ){

            return;

        }


        lastAcceptedCode =
            materialNo;

        lastAcceptedTime =
            now;


        acceptMaterialNo(
            materialNo
        );

    }

}


/* =========================================================
   최종 확정
========================================================= */

function acceptMaterialNo(
    materialNo
){

    /*
     * 카메라 종료
     */

    stopScanner();


    /*
     * 최종 번호 표시
     */

    document
        .getElementById(
            "detectedNumber"
        )
        .textContent =
        materialNo;


    document
        .getElementById(
            "detectedBox"
        )
        .style.display =
        "block";


    setStatus(
        "✅ Material No. 인식 완료: " +
        materialNo,
        "success"
    );


    /*
     * 실제 부품 조회
     */

    lookupPart(
        materialNo
    );

}


/* =========================================================
   카메라 트랙
========================================================= */

function setupCameraTrack(){

    try{

        const video =
            document.getElementById(
                "video"
            );


        if(
            !video ||
            !video.srcObject
        ){

            return;

        }


        const tracks =
            video
                .srcObject
                .getVideoTracks();


        if(
            !tracks ||
            !tracks.length
        ){

            return;

        }


        currentTrack =
            tracks[0];


        setupCameraCapabilities();


    }catch(error){

        console.log(
            "Track error:",
            error
        );

    }

}


/* =========================================================
   카메라 기능
========================================================= */

function setupCameraCapabilities(){

    if(!currentTrack){

        return;

    }


    try{

        const capabilities =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};


        /*
         * 줌
         */

        if(
            capabilities.zoom
        ){

            minZoom =
                capabilities.zoom.min ||
                1;

            maxZoom =
                capabilities.zoom.max ||
                1;


            currentZoom =
                Math.min(
                    Math.max(
                        1.5,
                        minZoom
                    ),
                    maxZoom
                );


            applyZoom();

        }


        /*
         * 연속 자동초점
         */

        if(
            capabilities.focusMode
        ){

            if(
                capabilities
                    .focusMode
                    .includes(
                        "continuous"
                    )
            ){

                currentTrack
                    .applyConstraints({

                        advanced:[
                            {
                                focusMode:
                                    "continuous"
                            }
                        ]

                    })
                    .catch(
                        () => {}
                    );

            }

        }

    }catch(error){

        console.log(
            "Capability error:",
            error
        );

    }

}


/* =========================================================
   스캐너 종료
========================================================= */

function stopScanner(){

    try{

        if(controls){

            controls.stop();

        }

    }catch(e){}


    try{

        if(
            codeReader &&
            codeReader.reset
        ){

            codeReader.reset();

        }

    }catch(e){}


    try{

        const video =
            document.getElementById(
                "video"
            );


        if(video){

            video.pause();

            if(video.srcObject){

                video
                    .srcObject
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );

            }

            video.srcObject =
                null;

        }

    }catch(e){}


    scannerRunning =
        false;


    controls =
        null;


    codeReader =
        null;


    currentTrack =
        null;


    document
        .getElementById(
            "scannerBox"
        )
        .style.display =
        "none";


    resetCandidate();

}


/* =========================================================
   줌 +
========================================================= */

async function zoomIn(){

    if(!currentTrack){

        setStatus(
            "카메라가 아직 준비되지 않았습니다.",
            "warning"
        );

        return;

    }


    if(
        maxZoom <=
        minZoom
    ){

        setStatus(
            "이 휴대폰에서는 웹 줌을 지원하지 않습니다.",
            "warning"
        );

        return;

    }


    currentZoom =
        Math.min(
            currentZoom + 0.5,
            maxZoom
        );


    await applyZoom();

}


/* =========================================================
   줌 -
========================================================= */

async function zoomOut(){

    if(!currentTrack){

        return;

    }


    if(
        maxZoom <=
        minZoom
    ){

        return;

    }


    currentZoom =
        Math.max(
            currentZoom - 0.5,
            minZoom
        );


    await applyZoom();

}


/* =========================================================
   줌 적용
========================================================= */

async function applyZoom(){

    if(!currentTrack){

        return;

    }


    try{

        await currentTrack
            .applyConstraints({

                advanced:[
                    {
                        zoom:
                            currentZoom
                    }
                ]

            });

    }catch(error){

        console.log(
            "Zoom error:",
            error
        );

    }

}


/* =========================================================
   조명
========================================================= */

async function toggleTorch(){

    if(!currentTrack){

        setStatus(
            "카메라가 아직 준비되지 않았습니다.",
            "warning"
        );

        return;

    }


    try{

        const capabilities =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};


        if(
            !capabilities.torch
        ){

            setStatus(
                "이 휴대폰에서는 웹 조명을 지원하지 않습니다.",
                "warning"
            );

            return;

        }


        torchOn =
            !torchOn;


        await currentTrack
            .applyConstraints({

                advanced:[
                    {
                        torch:
                            torchOn
                    }
                ]

            });


    }catch(error){

        console.log(
            "Torch error:",
            error
        );

    }

}


/* =========================================================
   수동 조회
========================================================= */

function manualSearch(){

    const input =
        document.getElementById(
            "manualBarcode"
        );


    const raw =
        input.value.trim();


    const materialNo =
        getExactMaterialNo(
            raw
        );


    if(!materialNo){

        setStatus(
            "Material No.는 정확히 11자리 숫자여야 합니다.",
            "error"
        );

        return;

    }


    input.value =
        materialNo;


    lookupPart(
        materialNo
    );

}


/* =========================================================
   부품 조회
========================================================= */

function lookupPart(
    partNo
){

    partNo =
        String(partNo || "")
            .trim();


    if(!partNo){

        return;

    }


    document
        .getElementById(
            "loading"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "result"
        )
        .innerHTML =
        "";


    setStatus(
        "부품 정보를 조회하고 있습니다...",
        "warning"
    );


    /*
     * 현재 페이지가 Google Apps Script 환경이면
     * 기존 getPart()를 사용
     */
    if(
        typeof google !== "undefined" &&
        google.script &&
        google.script.run
    ){

        google.script.run

            .withSuccessHandler(
                function(data){

                    document
                        .getElementById(
                            "loading"
                        )
                        .style.display =
                        "none";


                    displayPart(
                        data
                    );

                }
            )

            .withFailureHandler(
                function(error){

                    document
                        .getElementById(
                            "loading"
                        )
                        .style.display =
                        "none";


                    setStatus(
                        "부품 조회 중 오류가 발생했습니다.",
                        "error"
                    );


                    console.error(
                        error
                    );

                }
            )

            .getPart(
                partNo
            );


        return;

    }


    /*
     * GitHub Pages 자체에서는
     * 현재 인식한 번호만 표시
     *
     * 실제 재고 데이터 API가 연결되어 있으면
     * 이 부분에 API 호출을 연결하면 된다.
     */

    displayPart({

        partNo:
            partNo

    });

}


/* =========================================================
   결과 출력
========================================================= */

function displayPart(
    data
){

    document
        .getElementById(
            "loading"
        )
        .style.display =
        "none";


    if(!data){

        setStatus(
            "등록된 부품을 찾지 못했습니다.",
            "error"
        );

        return;

    }


    const partNo =
        data.partNo ||
        data.partNumber ||
        data.materialNo ||
        data["부품번호"] ||

    const name =
        data.name ||
        data.partName ||
        data.description ||
        data["품명"] ||
        "";


    const spec =
        data.spec ||
        data.specification ||
        data["규격"] ||
        "";


    const stock =
        data.stock ??
        data.currentStock ??
        data["현재고"] ??
        "";


    const location =
        data.location ||
        data.currentLocation ||
        data["현재 로케이션"] ||
        "";


    const assignedLocation =
        data.assignedLocation ||
        data.designatedLocation ||
        data["지정 로케이션"] ||
        "";


    document
        .getElementById(
            "result"
        )
        .innerHTML = `

            <div class="card">

                <div class="result-row">

                    <div class="label">
                        Material No.
                    </div>

                    <div class="value">
                        ${escapeHtml(partNo)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        품명
                    </div>

                    <div class="value">
                        ${escapeHtml(name)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        규격
                    </div>

                    <div class="value">
                        ${escapeHtml(spec)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        현재고
                    </div>

                    <div class="value">
                        ${escapeHtml(stock)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        현재 로케이션
                    </div>

                    <div class="value">
                        ${escapeHtml(location)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        지정 로케이션
                    </div>

                    <div class="value">
                        ${escapeHtml(
                            assignedLocation
                        )}
                    </div>

                </div>

            </div>

        `;


    /*
     * 실제 데이터 연결 전
     */

    if(
        !name &&
        !spec &&
        stock === "" &&
        !location
    ){

        setStatus(
            "✅ 11자리 Material No. 인식 완료",
            "success"
        );

    }else{

        setStatus(
            "✅ 부품 조회 완료",
            "success"
        );

    }

}


/* =========================================================
   HTML Escape
========================================================= */

function escapeHtml(
    value
){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
