<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>부품 재고 조회</title>

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.2.6/dist/quagga.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    color: #111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        Arial,
        sans-serif;
}

.container {
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 50px;
}

h1 {
    text-align: center;
    font-size: 36px;
    margin: 30px 0 40px;
    font-weight: 800;
}

button {
    border: 0;
    border-radius: 16px;
    font-size: 20px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
}

.main-button {
    width: 100%;
    height: 70px;
    background: #222;
    color: white;
    margin-bottom: 20px;
}

.main-button:active {
    transform: scale(0.98);
}

/* =========================
   스캐너
========================= */

#scannerBox {
    display: none;
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 22px;
    overflow: hidden;
    margin-bottom: 20px;
}

#scanner {
    position: relative;
    width: 100%;
    min-height: 420px;
    background: #000;
    overflow: hidden;
}

/* Quagga가 만드는 video/canvas */
#scanner video {
    width: 100% !important;
    height: 100% !important;
    min-height: 420px;
    object-fit: cover;
}

#scanner canvas {
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
    width: 100% !important;
    height: 100% !important;
    pointer-events: none;
}

/* 바코드 가이드 */
.scan-guide {
    position: absolute;
    left: 7%;
    right: 7%;
    top: 50%;
    height: 150px;
    transform: translateY(-50%);
    border: 3px solid white;
    border-radius: 14px;
    z-index: 20;
    pointer-events: none;
}

.scan-guide::before,
.scan-guide::after {
    content: "";
    position: absolute;
    left: 8%;
    right: 8%;
    height: 3px;
    background: #ff3b30;
    animation: scanline 1.7s infinite;
}

@keyframes scanline {
    0% {
        top: 10%;
        opacity: 0.5;
    }

    50% {
        top: 90%;
        opacity: 1;
    }

    100% {
        top: 10%;
        opacity: 0.5;
    }
}

.corner {
    position: absolute;
    width: 30px;
    height: 30px;
    border-color: white;
    border-style: solid;
}

.corner.tl {
    left: -3px;
    top: -3px;
    border-width: 5px 0 0 5px;
}

.corner.tr {
    right: -3px;
    top: -3px;
    border-width: 5px 5px 0 0;
}

.corner.bl {
    left: -3px;
    bottom: -3px;
    border-width: 0 0 5px 5px;
}

.corner.br {
    right: -3px;
    bottom: -3px;
    border-width: 0 5px 5px 0;
}

.scan-message {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 20px;
    text-align: center;
    color: white;
    font-size: 16px;
    font-weight: 600;
    z-index: 30;
    text-shadow: 0 2px 5px #000;
}

.scanner-controls {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #111;
}

.scanner-controls button {
    flex: 1;
    height: 48px;
    background: #333;
    color: white;
    font-size: 15px;
}

.close-button {
    width: 100%;
    height: 55px;
    margin-top: 10px;
    background: #e5e5e5;
    color: #111;
}

/* =========================
   결과
========================= */

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-top: 16px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.label {
    color: #777;
    font-size: 14px;
    margin-bottom: 6px;
}

.value {
    font-size: 22px;
    font-weight: 700;
    word-break: break-all;
}

.result-row {
    padding: 14px 0;
    border-bottom: 1px solid #eee;
}

.result-row:last-child {
    border-bottom: 0;
}

/* =========================
   수동 입력
========================= */

.manual {
    display: none;
    margin-top: 20px;
}

input,
select {
    width: 100%;
    height: 55px;
    border: 1px solid #ccc;
    border-radius: 12px;
    padding: 0 15px;
    font-size: 18px;
    background: white;
}

.manual button {
    width: 100%;
    height: 55px;
    margin-top: 10px;
    background: #222;
    color: white;
}

.status {
    text-align: center;
    font-size: 16px;
    color: #666;
    margin: 12px 0;
    min-height: 24px;
}

.success {
    color: #16833b;
    font-weight: 700;
}

.error {
    color: #d93025;
    font-weight: 700;
}

/* =========================
   로딩
========================= */

.loading {
    display: none;
    text-align: center;
    padding: 30px 10px;
    font-size: 17px;
}

/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    .container {
        padding: 18px 12px 40px;
    }

    h1 {
        font-size: 34px;
        margin: 25px 0 35px;
    }

    #scanner {
        min-height: 430px;
    }

    #scanner video {
        min-height: 430px;
    }

    .scan-guide {
        left: 5%;
        right: 5%;
        height: 135px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>부품 재고 조회</h1>

    <!-- 바코드 스캔 버튼 -->
    <button
        id="scanButton"
        class="main-button"
        onclick="startScanner()">
        📷 바코드 스캔
    </button>

    <!-- 스캐너 -->
    <div id="scannerBox">

        <div id="scanner">

            <div class="scan-guide">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>

            <div class="scan-message">
                바코드를 사각형 안에 크게 맞춰주세요
            </div>

        </div>

        <div class="scanner-controls">

            <button onclick="zoomOut()">
                − 줌
            </button>

            <button onclick="toggleTorch()">
                🔦 조명
            </button>

            <button onclick="zoomIn()">
                ＋ 줌
            </button>

        </div>

        <button
            class="close-button"
            onclick="stopScanner()">
            스캔 종료
        </button>

    </div>

    <!-- 상태 -->
    <div id="status" class="status"></div>

    <!-- 수동 입력 -->
    <div class="manual" id="manualBox">

        <input
            id="manualBarcode"
            type="text"
            inputmode="text"
            autocomplete="off"
            placeholder="바코드 번호 직접 입력">

        <button onclick="manualSearch()">
            부품 조회
        </button>

    </div>

    <!-- 로딩 -->
    <div id="loading" class="loading">
        🔍 부품 정보를 조회하고 있습니다...
    </div>

    <!-- 조회 결과 -->
    <div id="result"></div>

</div>


<script>

/* ============================================================
   전역 변수
============================================================ */

let scannerRunning = false;
let lastDetectedCode = "";
let lastDetectedTime = 0;

let currentTrack = null;
let currentZoom = 1;
let maxZoom = 1;
let minZoom = 1;
let torchOn = false;


/* ============================================================
   스캐너 시작
============================================================ */

async function startScanner() {

    if (scannerRunning) {
        return;
    }

    document.getElementById("scannerBox").style.display = "block";
    document.getElementById("manualBox").style.display = "none";
    document.getElementById("result").innerHTML = "";
    setStatus("카메라를 준비하고 있습니다...");

    try {

        /*
         * 먼저 카메라 권한을 요청한다.
         * 후면 카메라 우선.
         */
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                },
                width: {
                    ideal: 1920
                },
                height: {
                    ideal: 1080
                },
                focusMode: "continuous"
            },
            audio: false
        });

        /*
         * 실제 카메라 트랙 저장
         */
        currentTrack = stream.getVideoTracks()[0];

        const capabilities =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};

        if (capabilities.zoom) {

            minZoom = capabilities.zoom.min || 1;
            maxZoom = capabilities.zoom.max || 1;

            /*
             * 처음부터 너무 확대하지 않고
             * 적당히 확대.
             */
            currentZoom =
                Math.min(
                    Math.max(minZoom, 1.5),
                    maxZoom
                );

            try {

                await currentTrack.applyConstraints({
                    advanced: [
                        {
                            zoom: currentZoom
                        }
                    ]
                });

            } catch (e) {
                console.log("초기 줌 적용 실패", e);
            }
        }

        /*
         * Quagga가 같은 카메라를 사용하도록
         * 임시 stream을 먼저 종료한다.
         */
        stream.getTracks().forEach(track => track.stop());

        await initializeQuagga();

    } catch (error) {

        console.error(error);

        setStatus(
            "카메라를 사용할 수 없습니다. 카메라 권한을 허용해주세요.",
            true
        );

        document.getElementById("manualBox").style.display = "block";
    }
}


/* ============================================================
   Quagga 초기화
============================================================ */

function initializeQuagga() {

    return new Promise((resolve, reject) => {

        Quagga.init({

            inputStream: {

                name: "Live",

                type: "LiveStream",

                target:
                    document.querySelector("#scanner"),

                constraints: {

                    width: {
                        min: 1280,
                        ideal: 1920,
                        max: 2560
                    },

                    height: {
                        min: 720,
                        ideal: 1080,
                        max: 1440
                    },

                    facingMode: "environment"
                },

                /*
                 * 화면 중앙 영역을 우선적으로 분석.
                 *
                 * 너무 좁게 잡으면 바코드를 놓칠 수 있으므로
                 * 가운데 약 86% 영역 사용.
                 */
                area: {
                    top: "20%",
                    right: "7%",
                    left: "7%",
                    bottom: "20%"
                }
            },

            /*
             * 작은 바코드 인식 개선.
             */
            locator: {

                /*
                 * 작은 바코드에서는
                 * 원본 해상도를 최대한 유지.
                 */
                halfSample: false,

                /*
                 * 작은 바코드를 찾기 위한 촘촘한 검색.
                 */
                patchSize: "small"
            },

            frequency: 10,

            locate: true,

            decoder: {

                /*
                 * BMW 부품 라벨에서 사용하는
                 * 1D 바코드를 우선적으로 찾는다.
                 */
                readers: [
                    "code_128_reader",
                    "code_39_reader",
                    "ean_reader",
                    "ean_8_reader",
                    "upc_reader",
                    "upc_e_reader",
                    "codabar_reader",
                    "i2of5_reader",
                    "2of5_reader",
                    "code_93_reader"
                ],

                multiple: false

            },

            numOfWorkers: 0,

            debug: {

                drawBoundingBox: false,
                showFrequency: false,
                drawScanline: false,
                showPattern: false

            }

        }, function(error) {

            if (error) {

                console.error(
                    "Quagga 초기화 오류:",
                    error
                );

                reject(error);
                return;
            }

            console.log(
                "Quagga 초기화 완료"
            );

            Quagga.start();

            scannerRunning = true;

            setStatus(
                "바코드를 사각형 안에 크게 맞춰주세요."
            );

            /*
             * 실제 video track 가져오기
             */
            setTimeout(() => {

                const video =
                    document.querySelector(
                        "#scanner video"
                    );

                if (video && video.srcObject) {

                    currentTrack =
                        video.srcObject
                            .getVideoTracks()[0];

                    setupCameraCapabilities();

                }

            }, 500);

            resolve();

        });

    });
}


/* ============================================================
   카메라 기능 확인
============================================================ */

function setupCameraCapabilities() {

    if (!currentTrack) {
        return;
    }

    try {

        const capabilities =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};

        if (capabilities.zoom) {

            minZoom =
                capabilities.zoom.min || 1;

            maxZoom =
                capabilities.zoom.max || 1;

            currentZoom =
                Math.min(
                    Math.max(1.5, minZoom),
                    maxZoom
                );

            applyZoom();

        }

    } catch (e) {

        console.log(
            "카메라 기능 확인 실패",
            e
        );

    }
}


/* ============================================================
   바코드 감지
============================================================ */

Quagga.onDetected(function(result) {

    if (!result || !result.codeResult) {
        return;
    }

    const code =
        result.codeResult.code;

    if (!code) {
        return;
    }

    /*
     * 숫자/문자가 너무 짧은 오검출 방지
     */
    const cleaned =
        String(code)
            .trim();

    if (cleaned.length < 4) {
        return;
    }

    /*
     * 같은 바코드가 계속 감지되는 것을 방지
     */
    const now = Date.now();

    if (
        cleaned === lastDetectedCode &&
        now - lastDetectedTime < 2000
    ) {
        return;
    }

    /*
     * 너무 빠른 오검출 방지
     */
    if (
        now - lastDetectedTime < 500
    ) {
        return;
    }

    lastDetectedCode = cleaned;
    lastDetectedTime = now;

    console.log(
        "BARCODE:",
        cleaned
    );

    /*
     * 바로 확정하지 않고
     * 짧은 성공 메시지를 보여준다.
     */
    setStatus(
        "✅ 바코드 인식 완료: " + cleaned
    );

    stopScanner();

    /*
     * 부품 조회
     */
    lookupPart(cleaned);

});


/* ============================================================
   스캐너 종료
============================================================ */

function stopScanner() {

    if (!scannerRunning) {

        document.getElementById(
            "scannerBox"
        ).style.display = "none";

        return;
    }

    try {

        Quagga.stop();

    } catch (e) {

        console.log(
            "Quagga 종료:",
            e
        );

    }

    scannerRunning = false;

    currentTrack = null;

    document.getElementById(
        "scannerBox"
    ).style.display = "none";

}


/* ============================================================
   줌 +
============================================================ */

async function zoomIn() {

    if (!currentTrack) {
        return;
    }

    if (maxZoom <= minZoom) {

        setStatus(
            "이 카메라는 웹에서 줌을 지원하지 않습니다."
        );

        return;
    }

    currentZoom =
        Math.min(
            currentZoom + 0.5,
            maxZoom
        );

    await applyZoom();
}


/* ============================================================
   줌 -
============================================================ */

async function zoomOut() {

    if (!currentTrack) {
        return;
    }

    if (maxZoom <= minZoom) {
        return;
    }

    currentZoom =
        Math.max(
            currentZoom - 0.5,
            minZoom
        );

    await applyZoom();
}


/* ============================================================
   줌 적용
============================================================ */

async function applyZoom() {

    if (!currentTrack) {
        return;
    }

    try {

        await currentTrack.applyConstraints({
            advanced: [
                {
                    zoom: currentZoom
                }
            ]
        });

        console.log(
            "Zoom:",
            currentZoom
        );

    } catch (error) {

        console.log(
            "줌 적용 실패",
            error
        );

    }
}


/* ============================================================
   손전등
============================================================ */

async function toggleTorch() {

    if (!currentTrack) {
        return;
    }

    try {

        const capabilities =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};

        if (!capabilities.torch) {

            setStatus(
                "이 휴대폰 브라우저에서는 조명 기능을 지원하지 않습니다."
            );

            return;
        }

        torchOn = !torchOn;

        await currentTrack.applyConstraints({
            advanced: [
                {
                    torch: torchOn
                }
            ]
        });

    } catch (error) {

        console.log(
            "Torch 오류:",
            error
        );

    }
}


/* ============================================================
   수동 입력
============================================================ */

function manualSearch() {

    const input =
        document.getElementById(
            "manualBarcode"
        );

    const code =
        input.value.trim();

    if (!code) {

        setStatus(
            "바코드 번호를 입력해주세요.",
            true
        );

        return;
    }

    lookupPart(code);
}


/* ============================================================
   부품 조회
============================================================ */

function lookupPart(partNo) {

    partNo =
        String(partNo)
            .trim();

    if (!partNo) {
        return;
    }

    document.getElementById(
        "loading"
    ).style.display = "block";

    document.getElementById(
        "result"
    ).innerHTML = "";

    setStatus(
        "부품 정보를 조회하고 있습니다..."
    );

    /*
     * 기존 Google Apps Script와 연결되어 있는 경우
     */
    if (
        typeof google !== "undefined" &&
        google.script &&
        google.script.run
    ) {

        google.script.run
            .withSuccessHandler(
                function(data) {

                    document.getElementById(
                        "loading"
                    ).style.display = "none";

                    displayPart(data);

                }
            )
            .withFailureHandler(
                function(error) {

                    document.getElementById(
                        "loading"
                    ).style.display = "none";

                    console.error(error);

                    setStatus(
                        "부품 조회 중 오류가 발생했습니다.",
                        true
                    );

                }
            )
            .getPart(partNo);

        return;
    }

    /*
     * GitHub Pages에서 직접 실행되는 경우
     *
     * 기존 시스템이 URL 파라미터를 이용한다면
     * barcode 값을 전달한다.
     */
    const url =
        new URL(
            window.location.href
        );

    url.searchParams.set(
        "barcode",
        partNo
    );

    /*
     * 현재 페이지에 바코드 표시
     *
     * Google Apps Script 연결이 없는 경우
     * 우선 번호를 보여준다.
     */
    displayPart({
        partNo: partNo
    });

}


/* ============================================================
   조회 결과 표시
============================================================ */

function displayPart(data) {

    if (!data) {

        setStatus(
            "등록된 부품을 찾을 수 없습니다.",
            true
        );

        return;
    }

    /*
     * 기존 getPart() 반환 형식 대응
     */
    const partNo =
        data.partNo ||
        data.partNumber ||
        data.materialNo ||
        data["부품번호"] ||
        "";

    const name =
        data.name ||
        data.partName ||
        data.description ||
        data["품명"] ||
        "";

    const spec =
        data.spec ||
        data.specification ||
        data["규격"] ||
        "";

    const stock =
        data.stock ??
        data.currentStock ??
        data["현재고"] ??
        "";

    const location =
        data.location ||
        data.currentLocation ||
        data["현재 로케이션"] ||
        "";

    const assignedLocation =
        data.assignedLocation ||
        data.designatedLocation ||
        data["지정 로케이션"] ||
        "";

    document.getElementById(
        "result"
    ).innerHTML = `

        <div class="card">

            <div class="result-row">
                <div class="label">
                    부품번호
                </div>

                <div class="value">
                    ${escapeHtml(partNo)}
                </div>
            </div>


            <div class="result-row">
                <div class="label">
                    품명
                </div>

                <div class="value">
                    ${escapeHtml(name)}
                </div>
            </div>


            <div class="result-row">
                <div class="label">
                    규격
                </div>

                <div class="value">
                    ${escapeHtml(spec)}
                </div>
            </div>


            <div class="result-row">
                <div class="label">
                    현재고
                </div>

                <div class="value">
                    ${escapeHtml(stock)}
                </div>
            </div>


            <div class="result-row">
                <div class="label">
                    현재 로케이션
                </div>

                <div class="value">
                    ${escapeHtml(location)}
                </div>
            </div>


            <div class="result-row">
                <div class="label">
                    지정 로케이션
                </div>

                <div class="value">
                    ${escapeHtml(assignedLocation)}
                </div>
            </div>

        </div>

    `;

    setStatus(
        "✅ 부품 조회 완료"
    );

}


/* ============================================================
   HTML 보안 처리
============================================================ */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   상태 표시
============================================================ */

function setStatus(
    message,
    isError = false
) {

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        message;

    status.className =
        "status " +
        (isError
            ? "error"
            : "success");
}


/* ============================================================
   페이지 종료 시 카메라 정리
============================================================ */

window.addEventListener(
    "beforeunload",
    function() {

        try {

            if (scannerRunning) {
                Quagga.stop();
            }

        } catch (e) {}

    }
);


/* ============================================================
   바코드 입력창 엔터
============================================================ */

document
    .getElementById("manualBarcode")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                manualSearch();

            }

        }
    );

</script>
