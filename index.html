<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f4f4;
    color:#111;

        -apple-system,

</head>


<body>

<div class="container">


<h1>부품 재고 조회</h1>


<!-- =====================================================
     촬영 버튼
====================================================== -->

<label
    for="photoInput"
    class="capture-button">

    📷 부품 태그 촬영

</label>


<input
    id="photoInput"
    type="file"
    accept="image/*"
    capture="environment">


<!-- =====================================================
     안내
====================================================== -->

<div class="guide">

    <strong>촬영 방법</strong><br>

    ① 부품 태그 전체가 사진에 들어오게 촬영<br>

    ② 바코드는 최대한 선명하게 찍기<br>

    ③ 흔들리지 않게 잠깐 멈춘 후 촬영<br>

    ④ 바코드가 너무 작으면 휴대폰을 조금 가까이 가져가기<br>

    ⑤ 촬영 후 사진에서 Code 39를 자동으로 찾습니다.

</div>


<!-- =====================================================
     사진
====================================================== -->

<div
    id="previewBox"
    class="preview-box">

    <img
        id="previewImage"
        alt="촬영한 사진">

</div>


<button
    id="analyzeButton"
    onclick="analyzePhoto()">

    🔎 사진에서 Code 39 찾기

</button>


<button
    id="retryButton"
    onclick="resetPage()">

    📷 다시 촬영

</button>


<!-- =====================================================
     상태
====================================================== -->

<div
    id="status"
    class="status">

    부품 태그를 촬영해주세요.

</div>


<!-- =====================================================
     원본
====================================================== -->

<div
    id="rawBox"
    class="debug">

    <div class="debug-title">

        Code 39 원본

    </div>

    <div
        id="rawValue"
        class="debug-value">
    </div>

</div>


<!-- =====================================================
     추출
====================================================== -->

<div
    id="partBox"
    class="debug">

    <div class="debug-title">

        추출된 부품번호

    </div>

    <div
        id="partValue"
        class="debug-value">
    </div>

</div>


<!-- =====================================================
     로딩
====================================================== -->

<div
    id="loading"
    class="loading">

    🔍 사진을 분석하고 있습니다...

</div>


<!-- =====================================================
     최종 결과
====================================================== -->

<div
    id="result"
    class="result">

    <div class="result-row">

        <div class="result-label">

            부품번호

        </div>

        <div
            id="materialResult"
            class="result-value">
        </div>

    </div>


    <div class="result-row">

        <div class="result-label">

            Quantity

        </div>

        <div
            id="quantityResult"
            class="result-value">

            -

        </div>

    </div>

</div>


</div>


<script>

/* =========================================================
   전역
========================================================= */

let selectedFile = null;

let photoImage = null;


/* =========================================================
   사진 선택
========================================================= */

document
    .getElementById("photoInput")
    .addEventListener(
        "change",
        handlePhoto
    );


/* =========================================================
   사진 처리
========================================================= */

function handlePhoto(event){

    const file =
        event.target.files &&
        event.target.files[0];


    if(!file){

        return;

    }


    selectedFile =
        file;


    /*
     * 미리보기
     */

    const url =
        URL.createObjectURL(
            file
        );


    const image =
        document.getElementById(
            "previewImage"
        );


    image.onload =
        function(){

            photoImage =
                image;

            URL.revokeObjectURL(
                url
            );

        };


    image.src =
        url;


    document
        .getElementById(
            "previewBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "analyzeButton"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "retryButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "rawBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "partBox"
        )
        .style.display =
        "none";


    setStatus(
        "사진 촬영 완료. 이제 Code 39를 찾아보세요.",
        "warning"
    );

}


/* =========================================================
   사진 분석
========================================================= */

async function analyzePhoto(){

    if(!selectedFile){

        setStatus(
            "먼저 사진을 촬영해주세요.",
            "error"
        );

        return;

    }


    setStatus(
        "사진에서 Code 39를 찾고 있습니다...",
        "warning"
    );


    document
        .getElementById(
            "loading"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "analyzeButton"
        )
        .disabled =
        true;


    try{

        /*
         * 임시 HTML5 QR 스캐너
         *
         * 화면에 보이지 않게 사용
         */

        const tempId =
            "tempBarcodeReader";


        const temp =
            document.createElement(
                "div"
            );


        temp.id =
            tempId;


        temp.style.display =
            "none";


        document.body.appendChild(
            temp
        );


        const scanner =
            new Html5Qrcode(
                tempId
            );


        /*
         * 사진에서 Code 39만 읽음
         */

        const result =
            await scanner.scanFile(
                selectedFile,
                true
            );


        console.log(
            "Code39 photo result:",
            result
        );


        /*
         * 원본 표시
         */

        document
            .getElementById(
                "rawBox"
            )
            .style.display =
            "block";


        document
            .getElementById(
                "rawValue"
            )
            .textContent =
            result;


        /*
         * 뒤 9자리
         */

        const part =
            extractLast9(
                result
            );


        if(!part){

            throw new Error(
                "부품번호를 추출하지 못했습니다."
            );

        }


        document
            .getElementById(
                "partBox"
            )
            .style.display =
            "block";


        document
            .getElementById(
                "partValue"
            )
            .textContent =
            part;


        /*
         * 최종 결과
         */

        document
            .getElementById(
                "materialResult"
            )
            .textContent =
            part;


        document
            .getElementById(
                "quantityResult"
            )
            .textContent =
            "-";


        document
            .getElementById(
                "result"
            )
            .style.display =
            "block";


        setStatus(
            "✅ Code 39 인식 완료",
            "success"
        );


        try{

            await scanner.clear();

        }catch(e){}


        temp.remove();


        document
            .getElementById(
                "retryButton"
            )
            .style.display =
            "block";


    }catch(error){

        console.error(
            "Photo barcode error:",
            error
        );


        setStatus(
            "사진에서 Code 39를 찾지 못했습니다. 바코드를 더 크게 또는 선명하게 촬영해주세요.",
            "error"
        );


        document
            .getElementById(
                "retryButton"
            )
            .style.display =
            "block";

    }


    document
        .getElementById(
            "loading"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "analyzeButton"
        )
        .disabled =
        false;

}


/* =========================================================
   뒤 9자리
========================================================= */

function extractLast9(
    raw
){

    if(
        raw === null ||
        raw === undefined
    ){

        return null;

    }


    let value =
        String(raw)
            .trim()
            .toUpperCase();


    /*
     * Code39 * 제거
     */

    value =
        value.replace(
            /^\*+/,
            ""
        );


    value =
        value.replace(
            /\*+$/,
            ""
        );


    /*
     * 공백 제거
     */

    value =
        value.replace(
            /\s+/g,
            ""
        );


    /*
     * 최소 9자리
     */

    if(
        value.length <
        9
    ){

        return null;

    }


    /*
     * 마지막 9자리
     */

    return value.slice(
        -9
    );

}


/* =========================================================
   초기화
========================================================= */

function resetPage(){

    selectedFile =
        null;

    photoImage =
        null;


    document
        .getElementById(
            "photoInput"
        )
        .value =
        "";


    document
        .getElementById(
            "previewBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "analyzeButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "retryButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "rawBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "partBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "none";


    setStatus(
        "부품 태그를 촬영해주세요.",
        "warning"
    );

}


/* =========================================================
   페이지 종료
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        selectedFile =
            null;

        photoImage =
            null;

    }
);

</script>

</body>
</html>
