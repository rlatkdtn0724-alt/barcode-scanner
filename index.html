<body>

<div class="container">

<h1>부품 재고 조회</h1>


<button
    id="startButton"
    onclick="startScanner()">

    📷 Code 39 바코드 스캔

</button>


<div id="scannerBox">

    <div id="reader"></div>


    <!-- 큰 가이드 -->

    <div class="big-guide"></div>


    <div class="guide-title">

        바코드를 흰색 박스에 최대한 크게 맞춰주세요

    </div>

        카메라 준비 중...

        바코드 전체가 화면에 들어오게 하세요

    </div>

        id="stopButton"
        onclick="stopScanner()">

    </button>

</div>


<div

    class="warning">

    바코드를 스캔하세요.

</div>


<!-- 원본 -->

<div
    id="rawDebug"

    <div class="debug-label">
        Code 39 원본
    </div>

        id="rawValue"

</div>


<!-- 뒤 9자리 -->

<div
    id="partDebug"

    <div class="debug-label">

    </div>

<script>

/* =========================================================
   상태
========================================================= */

let scanner = null;

let running = false;

let candidate = "";

let candidateCount = 0;

let finalPart = "";


/*
 * 2회 동일 인식 후 확정
 */
const CONFIRM_COUNT = 2;


/* =========================================================
   상태 표시
========================================================= */

function setStatus(
    text,
    type = "warning"
){

    const el =
        document.getElementById(
            "status"
        );

    el.textContent =
        text;

    el.className =
        type;

}


/* =========================================================
   뒤 9자리 추출
========================================================= */

function getLast9(
    raw
){

    if(
        raw === null ||
        raw === undefined
    ){

        return null;

    }


    let value =
        String(raw)
            .trim()
            .toUpperCase();


    /*
     * Code39 start/stop *
     */
    value =
        value.replace(
            /^\*+/,
            ""
        );

    value =
        value.replace(
            /\*+$/,
            ""
        );


    /*
     * 공백 제거
     */
    value =
        value.replace(
            /\s+/g,
            ""
        );


    /*
     * 최소 9자리
     */
    if(
        value.length < 9
    ){

        return null;

    }


    /*
     * 뒤 9자리만
     */
    return value.slice(
        -9
    );

}


/* =========================================================
   바코드 결과
========================================================= */

function onBarcodeRead(
    decodedText,
    decodedResult
){

    if(!running){

        return;

    }


    if(!decodedText){

        return;

    }


    const raw =
        String(decodedText)
            .trim();


    console.log(
        "CODE39 RAW:",
        raw
    );


    /*
     * 원본 표시
     */

    document
        .getElementById(
            "rawDebug"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "rawValue"
        )
        .textContent =
        raw;


    /*
     * 뒤 9자리
     */

    const part =
        getLast9(
            raw
        );


    if(!part){

        return;

    }


    /*
     * 화면 표시
     */

    document
        .getElementById(
            "partDebug"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "partValue"
        )
        .textContent =
        part;


    /*
     * 같은 결과 반복 확인
     */

    if(
        part === candidate
    ){

        candidateCount++;

    }else{

        candidate =
            part;

        candidateCount =
            1;

    }


    document
        .getElementById(
            "scanStatus"
        )
        .textContent =

        "확인 중 " +

        Math.min(
            candidateCount,
            CONFIRM_COUNT
        ) +

        "/" +

        CONFIRM_COUNT;


    /*
     * 최종 확정
     */

    if(
        candidateCount >=
        CONFIRM_COUNT
    ){

        finalPart =
            part;


        finishScan();

    }

}


/* =========================================================
   시작
========================================================= */

async function startScanner(){

    if(running){

        return;

    }


    /*
     * 초기화
     */

    candidate =
        "";

    candidateCount =
        0;

    finalPart =
        "";


    document
        .getElementById(
            "scannerBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "startButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "result"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "rawDebug"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "partDebug"
        )
        .style.display =
        "none";


    setStatus(
        "카메라를 준비하고 있습니다...",
        "warning"
    );


    try{

        scanner =
            new Html5Qrcode(
                "reader"
            );


        /*
         * Code 39만 지원
         */

        const config = {

            fps:15,

            /*
             * 매우 넓은 스캔 영역
             */

            qrbox:function(
                width,
                height
            ){

                return {

                    width:
                        Math.floor(
                            width * .94
                        ),

                    height:
                        Math.floor(
                            Math.min(
                                190,
                                height * .30
                            )
                        )

                };

            },


            aspectRatio:
                1.7777778,


            formatsToSupport:[

                Html5QrcodeSupportedFormats
                    .CODE_39

            ],


            rememberLastUsedCamera:
                true,


            experimentalFeatures:{

                useBarCodeDetectorIfSupported:
                    true

            },


            showTorchButtonIfSupported:
                true

        };


        /*
         * 카메라 목록
         */

        const cameras =
            await Html5Qrcode
                .getCameras();


        if(
            !cameras ||
            !cameras.length
        ){

            throw new Error(
                "카메라를 찾을 수 없습니다."
            );

        }


        /*
         * 후면 카메라 선택
         */

        let camera =
            cameras.find(
                function(c){

                    const label =
                        String(
                            c.label || ""
                        )
                        .toLowerCase();


                    return(

                        label.includes(
                            "back"
                        ) ||

                        label.includes(
                            "rear"
                        ) ||

                        label.includes(
                            "environment"
                        )

                    );

                }
            );


        /*
         * 못 찾으면
         * 마지막 카메라
         */

        if(!camera){

            camera =
                cameras[
                    cameras.length - 1
                ];

        }


        /*
         * 시작
         */

        await scanner.start(

            camera.id,

            config,

            function(
                decodedText,
                decodedResult
            ){

                onBarcodeRead(
                    decodedText,
                    decodedResult
                );

            },

            function(errorMessage){

                /*
                 * 스캔 실패 메시지는 정상
                 */
            }

        );


        running =
            true;


        setStatus(
            "Code 39 바코드를 가까이 대주세요.",
            "warning"
        );


        document
            .getElementById(
                "scanStatus"
            )
            .textContent =
            "Code 39 인식 중...";


        /*
         * 비디오가 생성된 뒤
         * 카메라 설정 시도
         */

        setTimeout(
            setupVideoCamera,
            1000
        );


    }catch(error){

        console.error(
            "Scanner error:",
            error
        );


        running =
            false;


        document
            .getElementById(
                "scannerBox"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "startButton"
            )
            .style.display =
            "block";


        setStatus(
            "카메라를 열 수 없습니다.",
            "error"
        );


        document
            .getElementById(
                "manualBox"
            )
            .style.display =
            "block";

    }

}


/* =========================================================
   카메라 직접 설정
========================================================= */

function setupVideoCamera(){

    try{

        const video =
            document
                .querySelector(
                    "#reader video"
                );


        if(
            !video ||
            !video.srcObject
        ){

            return;

        }


        const tracks =
            video
                .srcObject
                .getVideoTracks();


        if(
            !tracks ||
            !tracks.length
        ){

            return;

        }


        const track =
            tracks[0];


        currentTrack =
            track;


        const capabilities =
            track.getCapabilities
                ? track.getCapabilities()
                : {};


        /*
         * 자동 초점
         */

        if(
            capabilities.focusMode &&
            capabilities.focusMode
                .includes(
                    "continuous"
                )
        ){

            track
                .applyConstraints({

                    advanced:[
                        {
                            focusMode:
                                "continuous"
                        }
                    ]

                })
                .catch(
                    () => {}
                );

        }


        /*
         * 해상도 최대한 높게
         */

        try{

            track
                .applyConstraints({

                    width:{
                        ideal:1920
                    },

                    height:{
                        ideal:1080
                    }

                })
                .catch(
                    () => {}
                );

        }catch(e){}

    }catch(error){

        console.log(
            "Camera setup:",
            error
        );

    }

}


/* =========================================================
   현재 카메라 트랙
========================================================= */

let currentTrack = null;


/* =========================================================
   종료
========================================================= */

async function stopScanner(){

    running =
        false;


    try{

        if(scanner){

            await scanner.stop();

        }

    }catch(e){}


    try{

        if(scanner){

            await scanner.clear();

        }

    }catch(e){}


    try{

        if(currentTrack){

            currentTrack.stop();

        }

    }catch(e){}


    scanner =
        null;

    currentTrack =
        null;


    document
        .getElementById(
            "scannerBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "startButton"
        )
        .style.display =
        "block";


    candidate =
        "";

    candidateCount =
        0;

}


/* =========================================================
   수동
========================================================= */

function manualSearch(){

    const value =
        document
            .getElementById(
                "manualPart"
            )
            .value
            .trim()
            .toUpperCase();


    if(
        value.length !== 9
    ){

        setStatus(
            "부품번호는 9자리로 입력해주세요.",
            "error"
        );

        return;

    }


    finalPart =
        value;


    document
        .getElementById(
            "materialResult"
        )
        .textContent =
        finalPart;


    document
        .getElementById(
            "result"
        )
        .style.display =
        "block";


    setStatus(
        "✅ 부품번호 입력 완료",
        "success"
    );

}


/* =========================================================
   페이지 종료
========================================================= */

window.addEventListener(
    "beforeunload",
    function(){

        stopScanner();

    }
);

</script>

</body>
</html>
