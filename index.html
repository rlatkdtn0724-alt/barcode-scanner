```html
<script>

/* ============================================================
   바코드 인식 설정
============================================================ */

/*
 * 최종적으로 인정할 Material No. 길이
 */
const MATERIAL_NO_LENGTH = 11;


/*
 * 같은 값이 몇 번 연속 확인되어야 확정할지
 */
const REQUIRED_CONFIRMATIONS = 3;


/*
 * 같은 값 확인 제한 시간
 */
const CONFIRM_WINDOW_MS = 2000;


/*
 * 상태
 */
let candidateValue = "";
let candidateCount = 0;
let candidateStartTime = 0;


/* ============================================================
   숫자만 정리
============================================================ */

function normalizeBarcode(raw){

    if(
        raw === null ||
        raw === undefined
    ){
        return "";
    }


    /*
     * 바코드 리더가 읽은 값을 문자열로 변환
     */
    let value =
        String(raw)
            .trim();


    /*
     * 바코드 값 안의 공백 / 하이픈 제거
     *
     * 예:
     * 123 456 789 01
     * 123-456-789-01
     *
     * → 숫자만 남김
     */
    value =
        value.replace(
            /[^0-9]/g,
            ""
        );


    return value;

}


/* ============================================================
   ★ 핵심
   정확히 11자리일 때만 인정
============================================================ */

function getValidMaterialNo(raw){

    const value =
        normalizeBarcode(raw);


    /*
     * 정확히 11자리만 통과
     */
    if(
        value.length !==
        MATERIAL_NO_LENGTH
    ){

        return null;

    }


    /*
     * 숫자 외 문자가 섞인 결과도
     * normalize 후 정확히 11자리면 통과
     */
    if(
        !/^\d{11}$/.test(value)
    ){

        return null;

    }


    return value;

}


/* ============================================================
   동일 바코드 확인
============================================================ */

function confirmBarcode(raw){

    /*
     * 정확히 11자리인지 먼저 확인
     */
    const materialNo =
        getValidMaterialNo(raw);


    /*
     * 11자리가 아니면 무조건 무시
     */
    if(!materialNo){

        return null;

    }


    const now =
        Date.now();


    /*
     * 이전 후보와 같은 값이고
     * 시간 안에 다시 감지되었다면 카운트 증가
     */
    if(
        materialNo === candidateValue &&
        now - candidateStartTime <=
        CONFIRM_WINDOW_MS
    ){

        candidateCount++;

    }else{

        /*
         * 새로운 후보
         */
        candidateValue =
            materialNo;

        candidateCount = 1;

        candidateStartTime =
            now;

    }


    /*
     * 화면에 현재 후보 표시
     */
    showDetectedNumber(
        materialNo
    );


    setScanConfirmMessage(
        "11자리 확인 중 " +
        Math.min(
            candidateCount,
            REQUIRED_CONFIRMATIONS
        ) +
        "/" +
        REQUIRED_CONFIRMATIONS
    );


    /*
     * 3번 같은 값이면 최종 확정
     */
    if(
        candidateCount >=
        REQUIRED_CONFIRMATIONS
    ){

        return materialNo;

    }


    return null;

}


/* ============================================================
   Quagga 바코드 감지
============================================================ */

function processDetectedBarcode(result){

    if(!scannerRunning){

        return;

    }


    if(
        !result ||
        !result.codeResult
    ){

        return;

    }


    const raw =
        result.codeResult.code;


    if(!raw){

        return;

    }


    console.log(
        "바코드 원본:",
        raw,
        "형식:",
        result.codeResult.format
    );


    /*
     * ★ 여기서 11자리인지 확인
     */
    const accepted =
        confirmBarcode(raw);


    /*
     * 아직 3번 확인되지 않았다면 종료
     */
    if(!accepted){

        return;

    }


    /*
     * 최종 확정
     */
    console.log(
        "최종 Material No.:",
        accepted
    );


    acceptBarcode(
        accepted
    );

}


/* ============================================================
   최종 확정
============================================================ */

function acceptBarcode(materialNo){

    /*
     * 카메라 종료
     */
    stopScanner();


    /*
     * 표시
     */
    document
        .getElementById(
            "detectedNumber"
        )
        .textContent =
        materialNo;


    document
        .getElementById(
            "detectedBox"
        )
        .style.display =
        "block";


    setStatus(
        "✅ 11자리 Material No. 인식 완료: " +
        materialNo,
        "success"
    );


    /*
     * 기존 조회 함수
     */
    lookupPart(
        materialNo
    );

}


/* ============================================================
   인식값 표시
============================================================ */

function showDetectedNumber(value){

    const box =
        document.getElementById(
            "detectedBox"
        );

    const number =
        document.getElementById(
            "detectedNumber"
        );


    box.style.display =
        "block";


    number.textContent =
        value;

}


/* ============================================================
   스캔 안내
============================================================ */

function setScanConfirmMessage(message){

    const el =
        document.getElementById(
            "scanConfirm"
        );


    if(el){

        el.textContent =
            message;

    }

}


/* ============================================================
   스캐너 시작 시 후보 초기화
============================================================ */

function resetBarcodeCandidate(){

    candidateValue = "";

    candidateCount = 0;

    candidateStartTime = 0;

}


/* ============================================================
   스캐너 시작
============================================================ */

async function startScanner(){

    if(scannerRunning){

        return;

    }


    /*
     * ★ 이전 오인식 값 초기화
     */
    resetBarcodeCandidate();


    document
        .getElementById(
            "scannerBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "manualBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "result"
        )
        .innerHTML =
        "";


    document
        .getElementById(
            "detectedBox"
        )
        .style.display =
        "none";


    setScanConfirmMessage(
        ""
    );


    setStatus(
        "카메라를 준비하고 있습니다...",
        "warning"
    );


    try{

        await initializeQuagga();

    }catch(error){

        console.error(error);

        scannerRunning = false;

        setStatus(
            "카메라를 열 수 없습니다.",
            "error"
        );

        showManualBox();

    }

}


/* ============================================================
   Quagga 초기화
============================================================ */

function initializeQuagga(){

    return new Promise(
        function(resolve,reject){

            try{
                Quagga.stop();
            }catch(e){}


            Quagga.init({

                inputStream:{

                    name:"Live",

                    type:"LiveStream",

                    target:
                        document.querySelector(
                            "#scanner"
                        ),

                    constraints:{

                        facingMode:{
                            ideal:"environment"
                        },

                        width:{
                            min:1280,
                            ideal:1920,
                            max:2560
                        },

                        height:{
                            min:720,
                            ideal:1080,
                            max:1440
                        }

                    },

                    /*
                     * 중앙 영역 중심으로 분석
                     */
                    area:{
                        top:"20%",
                        right:"5%",
                        left:"5%",
                        bottom:"20%"
                    }

                },


                locator:{

                    /*
                     * 원본 해상도 유지
                     */
                    halfSample:false,

                    /*
                     * 작은 바코드 대응
                     */
                    patchSize:"medium"

                },


                frequency:10,

                locate:true,


                decoder:{

                    /*
                     * 우선순위를 줄임
                     *
                     * 실제 바코드 형식을 모를 때는
                     * 여러 reader를 유지하되,
                     * 최종적으로 정확히 11자리인 것만 통과시킨다.
                     */

                    readers:[

                        "code_128_reader",

                        "code_39_reader",

                        "code_93_reader",

                        "ean_reader",

                        "ean_8_reader",

                        "upc_reader",

                        "upc_e_reader",

                        "i2of5_reader",

                        "2of5_reader",

                        "codabar_reader"

                    ],

                    multiple:false

                },


                numOfWorkers:2,

                debug:{

                    drawBoundingBox:false,

                    showFrequency:false,

                    drawScanline:false,

                    showPattern:false

                }

            },function(error){

                if(error){

                    reject(error);

                    return;

                }


                try{

                    Quagga.start();

                    scannerRunning =
                        true;

                }catch(e){

                    reject(e);

                    return;

                }


                setTimeout(
                    setupCameraTrack,
                    800
                );


                setStatus(
                    "바코드를 사각형 안에 크게 맞춰주세요.",
                    "warning"
                );


                resolve();

            });

        }
    );

}


/* ============================================================
   바코드 검출 이벤트
============================================================ */

if(!window.__barcodeHandlerAttached){

    window.__barcodeHandlerAttached =
        true;

    Quagga.onDetected(
        processDetectedBarcode
    );

}


/* ============================================================
   스캐너 종료
============================================================ */

function stopScanner(){

    try{

        if(scannerRunning){

            Quagga.stop();

        }

    }catch(e){}


    scannerRunning =
        false;


    if(currentTrack){

        try{

            currentTrack.stop();

        }catch(e){}

    }


    currentTrack =
        null;


    document
        .getElementById(
            "scannerBox"
        )
        .style.display =
        "none";


    /*
     * 다음 스캔을 위해 초기화
     */
    resetBarcodeCandidate();

}


/* ============================================================
   수동 조회
============================================================ */

function manualSearch(){

    const input =
        document.getElementById(
            "manualBarcode"
        );


    const raw =
        input.value.trim();


    const materialNo =
        getValidMaterialNo(raw);


    /*
     * 수동 입력도 11자리만 인정
     */
    if(!materialNo){

        setStatus(
            "Material No.는 정확히 11자리 숫자로 입력해주세요.",
            "error"
        );

        return;

    }


    input.value =
        materialNo;


    lookupPart(
        materialNo
    );

}

</script>
