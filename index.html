<script>

/* ============================================================
   설정
============================================================ */

const MATERIAL_LENGTH = 11;

/*
 * 같은 11자리 번호를
 * 몇 번 확인할지
 */
const REQUIRED_CONFIRMATIONS = 3;

/*
 * 같은 번호를 확인할 수 있는 시간
 */
const CONFIRM_WINDOW = 2000;


/* ============================================================
   상태
============================================================ */

let scannerRunning = false;

let currentTrack = null;

let currentZoom = 1;

let minZoom = 1;

let maxZoom = 1;

let torchOn = false;


/*
 * 현재 후보
 */

let candidate = "";

let candidateCount = 0;

let candidateStart = 0;


/*
 * 마지막 확정값
 */

let acceptedCode = "";

let acceptedTime = 0;


/*
 * 이벤트 중복 방지
 */

let handlerAttached = false;


/* ============================================================
   상태 메시지
============================================================ */

function setStatus(
    message,
    type = ""
){

    const el =
        document.getElementById(
            "status"
        );

    el.textContent =
        message;

    el.className =
        "status";

    if(type){

        el.classList.add(
            type
        );

    }

}


/* ============================================================
   원본 바코드 표시
============================================================ */

function showRawValue(
    raw,
    cleaned
){

    document
        .getElementById(
            "rawBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "rawValue"
        )
        .textContent =
        raw;


    document
        .getElementById(
            "cleanValue"
        )
        .textContent =
        "숫자 정리 결과: " +
        cleaned;

}


/* ============================================================
   11자리 후보 검사
============================================================ */

function getExact11Digits(raw){

    if(
        raw === null ||
        raw === undefined
    ){

        return null;

    }


    const text =
        String(raw).trim();


    /*
     * 바코드 자체가 숫자 + 공백 정도라면
     * 공백을 제거하여 11자리 검사
     */
    const cleaned =
        text.replace(
            /[^0-9]/g,
            ""
        );


    /*
     * ★ 절대 앞/뒤를 잘라내지 않는다.
     *
     * 10자리 → 탈락
     * 12자리 → 탈락
     * 15자리 → 탈락
     *
     * 정확히 11자리만 통과
     */

    if(
        cleaned.length !==
        MATERIAL_LENGTH
    ){

        return null;

    }


    /*
     * 숫자로만 이루어졌는지 최종 확인
     */

    if(
        !/^\d{11}$/.test(
            cleaned
        )
    ){

        return null;

    }


    return cleaned;

}


/* ============================================================
   후보 초기화
============================================================ */

function resetCandidate(){

    candidate = "";

    candidateCount = 0;

    candidateStart = 0;

}


/* ============================================================
   시작
============================================================ */

async function startScanner(){

    if(scannerRunning){

        return;

    }


    resetCandidate();


    acceptedCode = "";

    acceptedTime = 0;


    document
        .getElementById(
            "scannerBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "manualBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "result"
        )
        .innerHTML =
        "";


    document
        .getElementById(
            "rawBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "detectedBox"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "scanConfirm"
        )
        .textContent =
        "";


    setStatus(
        "카메라를 준비하고 있습니다...",
        "warning"
    );


    try{

        await initializeQuagga();

    }catch(error){

        console.error(
            error
        );

        scannerRunning =
            false;


        setStatus(
            "카메라를 사용할 수 없습니다.",
            "error"
        );


        showManualBox();

    }

}


/* ============================================================
   Quagga 초기화
============================================================ */

function initializeQuagga(){

    return new Promise(
        function(resolve,reject){

            try{

                Quagga.stop();

            }catch(e){}


            Quagga.init({

                inputStream:{

                    name:"Live",

                    type:"LiveStream",

                    target:
                        document.querySelector(
                            "#scanner"
                        ),

                    constraints:{

                        facingMode:{
                            ideal:"environment"
                        },

                        width:{
                            min:1280,
                            ideal:1920,
                            max:2560
                        },

                        height:{
                            min:720,
                            ideal:1080,
                            max:1440
                        }

                    },

                    /*
                     * 가운데 영역 집중
                     */
                    area:{
                        top:"20%",
                        right:"5%",
                        left:"5%",
                        bottom:"20%"
                    }

                },


                /*
                 * 인식률 개선
                 */
                locator:{

                    /*
                     * 원본 해상도 유지
                     */
                    halfSample:false,

                    /*
                     * 너무 작게 잡지 않기
                     */
                    patchSize:"medium"

                },


                frequency:10,

                locate:true,


                decoder:{

                    /*
                     * 주요 1D 바코드 형식
                     */
                    readers:[

                        "code_128_reader",

                        "code_39_reader",

                        "code_93_reader",

                        "ean_reader",

                        "ean_8_reader",

                        "upc_reader",

                        "upc_e_reader",

                        "i2of5_reader",

                        "2of5_reader",

                        "codabar_reader"

                    ],

                    multiple:false

                },


                numOfWorkers:2,


                debug:{

                    drawBoundingBox:false,

                    showFrequency:false,

                    drawScanline:false,

                    showPattern:false

                }

            },function(error){

                if(error){

                    reject(error);

                    return;

                }


                try{

                    Quagga.start();

                    scannerRunning =
                        true;

                }catch(e){

                    reject(e);

                    return;

                }


                setStatus(
                    "바코드를 사각형 안에 크게 맞춰주세요.",
                    "warning"
                );


                setTimeout(
                    setupCameraTrack,
                    800
                );


                attachHandler();


                resolve();

            });

        }
    );

}


/* ============================================================
   카메라 트랙
============================================================ */

function setupCameraTrack(){

    try{

        const video =
            document.querySelector(
                "#scanner video"
            );


        if(
            !video ||
            !video.srcObject
        ){

            return;

        }


        const tracks =
            video
                .srcObject
                .getVideoTracks();


        if(
            !tracks ||
            !tracks.length
        ){

            return;

        }


        currentTrack =
            tracks[0];


        setupCameraCapabilities();


    }catch(error){

        console.log(
            error
        );

    }

}


/* ============================================================
   카메라 기능
============================================================ */

function setupCameraCapabilities(){

    if(!currentTrack){

        return;

    }


    try{

        const capabilities =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};


        /*
         * 줌
         */

        if(
            capabilities.zoom
        ){

            minZoom =
                capabilities.zoom.min ||
                1;

            maxZoom =
                capabilities.zoom.max ||
                1;


            currentZoom =
                Math.min(
                    Math.max(
                        1.5,
                        minZoom
                    ),
                    maxZoom
                );


            applyZoom();

        }


        /*
         * 자동 초점
         */

        if(
            capabilities.focusMode
        ){

            if(
                capabilities
                    .focusMode
                    .includes(
                        "continuous"
                    )
            ){

                try{

                    currentTrack
                        .applyConstraints({

                            advanced:[
                                {
                                    focusMode:
                                        "continuous"
                                }
                            ]

                        });

                }catch(e){}

            }

        }

    }catch(error){

        console.log(
            error
        );

    }

}


/* ============================================================
   Quagga 이벤트
============================================================ */

function attachHandler(){

    if(handlerAttached){

        return;

    }

    handlerAttached =
        true;


    Quagga.onDetected(
        processBarcode
    );

}


/* ============================================================
   ★ 바코드 처리
============================================================ */

function processBarcode(result){

    if(!scannerRunning){

        return;

    }


    if(
        !result ||
        !result.codeResult
    ){

        return;

    }


    const raw =
        result.codeResult.code;


    if(!raw){

        return;

    }


    console.log(
        "======================"
    );

    console.log(
        "바코드 원본:",
        raw
    );

    console.log(
        "바코드 형식:",
        result.codeResult.format
    );

    console.log(
        "======================"
    );


    /*
     * 숫자 정리
     */

    const cleaned =
        String(raw)
            .replace(
                /[^0-9]/g,
                ""
            );


    /*
     * ★ 디버깅을 위해 원본값 표시
     */

    showRawValue(
        raw,
        cleaned
    );


    /*
     * ★ 정확히 11자리인지 확인
     */

    const materialNo =
        getExact11Digits(
            raw
        );


    /*
     * 11자리 아니면 절대 인정하지 않음
     */

    if(!materialNo){

        setStatus(
            "바코드는 읽었지만 11자리 Material No.가 아닙니다.",
            "warning"
        );


        document
            .getElementById(
                "scanConfirm"
            )
            .textContent =
            "인식값 확인 중...";


        return;

    }


    /*
     * 이미 방금 확정한 값이면 무시
     */

    const now =
        Date.now();


    if(
        materialNo ===
        acceptedCode &&
        now - acceptedTime < 3000
    ){

        return;

    }


    /*
     * 동일한 값인지 확인
     */

    if(
        materialNo === candidate &&
        now - candidateStart <=
        CONFIRM_WINDOW
    ){

        candidateCount++;

    }else{

        candidate =
            materialNo;

        candidateCount =
            1;

        candidateStart =
            now;

    }


    /*
     * 현재 후보 표시
     */

    document
        .getElementById(
            "detectedBox"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "detectedNumber"
        )
        .textContent =
        materialNo;


    document
        .getElementById(
            "scanConfirm"
        )
        .textContent =
        "11자리 번호 확인 중 " +
        Math.min(
            candidateCount,
            REQUIRED_CONFIRMATIONS
        ) +
        "/" +
        REQUIRED_CONFIRMATIONS;


    /*
     * 3회 확인
     */

    if(
        candidateCount >=
        REQUIRED_CONFIRMATIONS
    ){

        acceptedCode =
            materialNo;

        acceptedTime =
            Date.now();


        acceptBarcode(
            materialNo
        );

    }

}


/* ============================================================
   최종 확정
============================================================ */

function acceptBarcode(materialNo){

    stopScanner();


    document
        .getElementById(
            "detectedNumber"
        )
        .textContent =
        materialNo;


    document
        .getElementById(
            "detectedBox"
        )
        .style.display =
        "block";


    setStatus(
        "✅ 11자리 Material No. 인식 완료: " +
        materialNo,
        "success"
    );


    /*
     * 기존 부품 조회
     */

    lookupPart(
        materialNo
    );

}


/* ============================================================
   스캐너 종료
============================================================ */

function stopScanner(){

    try{

        if(scannerRunning){

            Quagga.stop();

        }

    }catch(e){}


    scannerRunning =
        false;


    try{

        if(currentTrack){

            currentTrack.stop();

        }

    }catch(e){}


    currentTrack =
        null;


    document
        .getElementById(
            "scannerBox"
        )
        .style.display =
        "none";


    resetCandidate();

}


/* ============================================================
   줌 +
============================================================ */

async function zoomIn(){

    if(!currentTrack){

        return;

    }


    if(
        maxZoom <= minZoom
    ){

        setStatus(
            "이 휴대폰에서는 웹 줌을 지원하지 않습니다.",
            "warning"
        );

        return;

    }


    currentZoom =
        Math.min(
            currentZoom + .5,
            maxZoom
        );


    await applyZoom();

}


/* ============================================================
   줌 -
============================================================ */

async function zoomOut(){

    if(!currentTrack){

        return;

    }


    if(
        maxZoom <= minZoom
    ){

        return;

    }


    currentZoom =
        Math.max(
            currentZoom - .5,
            minZoom
        );


    await applyZoom();

}


/* ============================================================
   줌 적용
============================================================ */

async function applyZoom(){

    if(!currentTrack){

        return;

    }


    try{

        await currentTrack
            .applyConstraints({

                advanced:[
                    {
                        zoom:
                            currentZoom
                    }
                ]

            });

    }catch(error){

        console.log(
            "줌 오류:",
            error
        );

    }

}


/* ============================================================
   손전등
============================================================ */

async function toggleTorch(){

    if(!currentTrack){

        return;

    }


    try{

        const capabilities =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};


        if(
            !capabilities.torch
        ){

            setStatus(
                "이 휴대폰에서는 웹 조명을 지원하지 않습니다.",
                "warning"
            );

            return;

        }


        torchOn =
            !torchOn;


        await currentTrack
            .applyConstraints({

                advanced:[
                    {
                        torch:
                            torchOn
                    }
                ]

            });


    }catch(error){

        console.log(
            "조명 오류:",
            error
        );

    }

}

============================================================ */

function manualSearch(){

    const input =
        document.getElementById(
            "manualBarcode"
        );


    const raw =
        input.value.trim();


    const materialNo =
        getExact11Digits(
            raw
        );


    if(!materialNo){

        setStatus(
            "Material No.는 정확히 11자리 숫자여야 합니다.",
            "error"
        );

        return;

    }


    input.value =
        materialNo;


    lookupPart(
        materialNo
    );

}


/* ============================================================
   부품 조회
============================================================ */

function lookupPart(partNo){

    partNo =
        String(partNo || "")
            .trim();


    if(!partNo){

        return;

    }


    document
        .getElementById(
            "loading"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "result"
        )
        .innerHTML =
        "";


    setStatus(
        "부품 정보를 조회하고 있습니다...",
        "warning"
    );


    /*
     * Google Apps Script 환경
     */

    if(
        typeof google !== "undefined" &&
        google.script &&
        google.script.run
    ){

        google.script.run

            .withSuccessHandler(
                function(data){

                    document
                        .getElementById(
                            "loading"
                        )
                        .style.display =
                        "none";


                    displayPart(
                        data
                    );

                }
            )

            .withFailureHandler(
                function(error){

                    document
                        .getElementById(
                            "loading"
                        )
                        .style.display =
                        "none";


                    setStatus(
                        "부품 조회 중 오류가 발생했습니다.",
                        "error"
                    );


                    console.error(
                        error
                    );

                }
            )

            .getPart(
                partNo
            );


        return;

    }


    /*
     * GitHub Pages
     *
     * 실제 API 연결 전에는
     * 인식된 Material No.만 표시
     */

    displayPart({

        partNo:partNo

    });

}

/* ============================================================
   HTML escape
============================================================ */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
