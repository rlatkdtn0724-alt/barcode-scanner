<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>부품번호 스캔</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#f4f4f4;
    color:#111;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        Arial,
        sans-serif;
}

.container{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:18px 12px 40px;
}

h1{
    text-align:center;
    font-size:30px;
    margin:20px 0 25px;
    font-weight:800;
}

button,
input{
    font-family:inherit;
}

.capture-button{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:68px;
    border:0;
    border-radius:15px;
    background:#2563eb;
    color:white;
    font-size:21px;
    font-weight:800;
    cursor:pointer;
}

.capture-button:active{
    transform:scale(.98);
}

#photoInput{
    display:none;
}

.guide{
    background:white;
    border-radius:14px;
    padding:14px;
    margin-top:12px;
    font-size:14px;
    line-height:1.6;
    color:#555;
}

#loading{
    display:none;
    text-align:center;
    padding:18px 5px;
    font-size:16px;
    font-weight:700;
}

#status{
    min-height:25px;
    margin:15px 0;
    text-align:center;
    font-size:16px;
    font-weight:700;
}

.success{
    color:#16833b;
}

.error{
    color:#d93025;
}

.warning{
    color:#996600;
}

.result{
    display:none;
    background:white;
    border-radius:16px;
    padding:20px;
    margin-top:15px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.field{
    margin-bottom:18px;
}

.field:last-child{
    margin-bottom:0;
}

.field label{
    display:block;
    color:#666;
    font-size:14px;
    margin-bottom:7px;
}

.field input{
    width:100%;
    height:58px;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:0 14px;
    font-size:25px;
    font-weight:800;
    background:#fff;
}

#partNo{
    letter-spacing:1px;
}

#quantity{
    font-size:25px;
}

.action-button{
    width:100%;
    height:58px;
    border:0;
    border-radius:13px;
    background:#111827;
    color:white;
    font-size:18px;
    font-weight:800;
    margin-top:12px;
}

#retryButton{
    display:none;
    background:#e5e7eb;
    color:#111827;
}

.small{
    font-size:13px;
    color:#777;
    margin-top:8px;
}

</style>

</head>

<body>

<div class="container">

<h1>부품번호 스캔</h1>

<label
    for="photoInput"
    class="capture-button">

    📷 바코드 촬영

</label>

<input
    id="photoInput"
    type="file"
    accept="image/*"
    capture="environment">

<div class="guide">

    <strong>촬영 방법</strong><br>
    바코드가 화면에서 크게 보이도록 촬영해주세요.<br>
    바코드만 가까이 찍을수록 인식이 빨라집니다.

</div>

<div
    id="loading">

    🔍 바코드 인식 중...

</div>

<div
    id="status"
    class="warning">

    바코드를 촬영해주세요.

</div>

<div
    id="result"
    class="result">

    <div class="field">

        <label for="partNo">
            부품번호 11자리
        </label>

        <input
            id="partNo"
            type="text"
            inputmode="text"
            maxlength="11"
            autocomplete="off">

        <div class="small">
            Code39에서 마지막 11자리를 자동 추출합니다.
        </div>

    </div>

    <div class="field">

        <label for="quantity">
            수량
        </label>

        <input
            id="quantity"
            type="number"
            min="1"
            inputmode="numeric"
            placeholder="수량 입력">

    </div>

    <button
        class="action-button"
        onclick="copyResult()">

        📋 부품번호 + 수량 복사

    </button>

</div>

<button
    id="retryButton"
    class="action-button"
    onclick="resetPage()">

    📷 다시 촬영

</button>

</div>

<script>

let selectedFile = null;


/* 사진 선택 */

document
    .getElementById("photoInput")
    .addEventListener(
        "change",
        handlePhoto
    );


function handlePhoto(event){

    const file =
        event.target.files &&
        event.target.files[0];

    if(!file){
        return;
    }

    selectedFile = file;

    analyzePhoto();

}


/* 사진 분석 */

async function analyzePhoto(){

    if(!selectedFile){
        return;
    }

    const loading =
        document.getElementById("loading");

    const retry =
        document.getElementById("retryButton");

    loading.style.display = "block";

    retry.style.display = "none";

    setStatus(
        "바코드 인식 중...",
        "warning"
    );

    try{

        const readerId =
            "barcodeReader";

        const reader =
            document.createElement("div");

        reader.id = readerId;

        reader.style.position = "fixed";
        reader.style.left = "-10000px";
        reader.style.top = "-10000px";
        reader.style.width = "1px";
        reader.style.height = "1px";

        document.body.appendChild(reader);

        const scanner =
            new Html5Qrcode(readerId);

        const raw =
            await scanner.scanFile(
                selectedFile,
                false
            );

        try{
            await scanner.clear();
        }catch(e){}

        reader.remove();

        const part =
            extractLast11(raw);

        if(!part){

            throw new Error(
                "11자리 부품번호를 추출하지 못했습니다."
            );

        }

        document
            .getElementById("partNo")
            .value = part;

        document
            .getElementById("result")
            .style.display = "block";

        setStatus(
            "✅ 부품번호 인식 완료",
            "success"
        );

        document
            .getElementById("quantity")
            .focus();

    }catch(error){

        console.error(error);

        setStatus(
            "❌ 인식 실패. 바코드를 더 크게 촬영해주세요.",
            "error"
        );

    }

    loading.style.display = "none";

    retry.style.display = "block";

}


/* 마지막 11자리 추출 */

function extractLast11(raw){

    if(
        raw === null ||
        raw === undefined
    ){

        return null;

    }

    let value =
        String(raw)
            .trim()
            .toUpperCase();

    value =
        value.replace(
            /^\*+/,
            ""
        );

    value =
        value.replace(
            /\*+$/,
            ""
        );

    value =
        value.replace(
            /\s+/g,
            ""
        );

    if(value.length < 11){

        return null;

    }

    return value.slice(-11);

}


/* 결과 복사 */

async function copyResult(){

    const part =
        document
            .getElementById("partNo")
            .value
            .trim();

    const quantity =
        document
            .getElementById("quantity")
            .value
            .trim();

    if(!part){

        setStatus(
            "부품번호를 확인해주세요.",
            "error"
        );

        return;

    }

    if(!quantity || Number(quantity) <= 0){

        setStatus(
            "수량을 입력해주세요.",
            "error"
        );

        return;

    }

    const text =
        part + "\t" + quantity;

    try{

        await navigator.clipboard.writeText(text);

        setStatus(
            "✅ 복사 완료: " +
            part +
            " / 수량 " +
            quantity,
            "success"
        );

    }catch(error){

        setStatus(
            "부품번호와 수량을 확인해주세요.",
            "warning"
        );

    }

}


/* 상태 표시 */

function setStatus(
    text,
    type
){

    const status =
        document.getElementById("status");

    status.textContent =
        text;

    status.className =
        type || "";

}


/* 초기화 */

function resetPage(){

    selectedFile = null;

    document
        .getElementById("photoInput")
        .value = "";

    document
        .getElementById("result")
        .style.display = "none";

    document
        .getElementById("retryButton")
        .style.display = "none";

    document
        .getElementById("loading")
        .style.display = "none";

    document
        .getElementById("partNo")
        .value = "";

    document
        .getElementById("quantity")
        .value = "";

    setStatus(
        "바코드를 촬영해주세요.",
        "warning"
    );

}

</script>

</body>
</html>
