<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>부품 재고 조회</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
}

.container {
    max-width: 500px;
    margin: auto;
}

h1 {
    text-align: center;
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 10px;
    border: 0;
    border-radius: 10px;
    background: #222;
    color: white;
    font-size: 18px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 15px;
    margin-top: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 18px;
}

#reader {
    width: 100%;
    margin-top: 20px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
}

.card {
    background: white;
    padding: 20px;
    margin-top: 20px;
    border-radius: 12px;
}

.row {
    margin: 15px 0;
}

.label {
    color: #777;
    font-size: 14px;
}

.value {
    font-size: 20px;
    font-weight: bold;
    margin-top: 5px;
}
</style>
</head>

<body>

<div class="container">

<h1>부품 재고 조회</h1>

<button id="scanButton" onclick="startScanner()">
📷 바코드 스캔 시작
</button>

<div id="reader"></div>

<input
    id="barcode"
    type="text"
    placeholder="바코드 번호"
>

<button onclick="searchPart()">
부품 조회
</button>

<div id="result"></div>

</div>


<script>

let html5QrCode = null;
let scanning = false;


function startScanner() {

    if (scanning) {
        return;
    }

    html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(

        {
            facingMode: "environment"
        },

        {
            fps: 10,
            qrbox: {
                width: 280,
                height: 150
            }
        },

        function(decodedText) {

            document.getElementById("barcode").value = decodedText;

            stopScanner();

            searchPart();

        },

        function(errorMessage) {
            // 스캔 중 오류는 무시
        }

    ).then(function() {

        scanning = true;

        document.getElementById("scanButton").innerText =
            "📷 바코드 스캔 중...";

    }).catch(function(error) {

        alert(
            "카메라를 실행할 수 없습니다.\n\n" +
            error
        );

    });
}


function stopScanner() {

    if (!html5QrCode || !scanning) {
        return;
    }

    html5QrCode.stop().then(function() {

        html5QrCode.clear();

        scanning = false;

        document.getElementById("scanButton").innerText =
            "📷 바코드 스캔 시작";

    });

}


function searchPart() {

    const barcode =
        document.getElementById("barcode").value.trim();

    if (!barcode) {

        alert("바코드를 먼저 스캔해주세요.");

        return;
    }

    document.getElementById("result").innerHTML = `

        <div class="card">

            <div class="row">
                <div class="label">바코드</div>
                <div class="value">
                    ${barcode}
                </div>
            </div>

            <div class="row">
                <div class="label">부품번호</div>
                <div class="value">
                    데이터 연결 예정
                </div>
            </div>

            <div class="row">
                <div class="label">부품명</div>
                <div class="value">
                    데이터 연결 예정
                </div>
            </div>

            <div class="row">
                <div class="label">현재고</div>
                <div class="value">
                    데이터 연결 예정
                </div>
            </div>

            <div class="row">
                <div class="label">현재 로케이션</div>
                <div class="value">
                    데이터 연결 예정
                </div>
            </div>

            <hr>

            <div class="label">
                새 로케이션
            </div>

            <input
                id="newLocation"
                type="text"
                placeholder="예: A-03-02"
            >

            <button onclick="changeLocation()">
                로케이션 변경
            </button>

        </div>

    `;
}


function changeLocation() {

    const location =
        document.getElementById("newLocation").value.trim();

    if (!location) {

        alert("새 로케이션을 입력해주세요.");

        return;
    }

    alert(
        "새 로케이션: " + location
    );

}

</script>

</body>
</html>
