<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RDC 태그 스캐너</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #f3f4f6;
      font-family: Arial, sans-serif;
      color: #111827;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      margin: 0 0 20px;
    }

    .camera-button {
      display: block;
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }

    .camera-button:active {
      background: #1d4ed8;
    }

    input[type="file"] {
      display: none;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      background: white;
      text-align: center;
      font-size: 14px;
      white-space: pre-line;
    }

    .result-box {
      margin-top: 16px;
      padding: 18px;
      background: white;
      border-radius: 12px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #4b5563;
    }

    .field input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 21px;
      font-weight: bold;
      background: #f9fafb;
    }

    .hint {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.6;
      color: #6b7280;
      text-align: center;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">

    <h2>RDC 태그 스캐너</h2>

    <label for="photoInput" class="camera-button">
      📷 촬영하기
    </label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      capture="environment"
    >

    <div id="status" class="status">
      흰색 RDC 스티커가 화면에 크게 나오도록 촬영하세요.
    </div>

    <div class="result-box">

      <div class="field">
        <label for="partNumber">부품번호</label>
        <input
          id="partNumber"
          type="text"
          placeholder="부품번호"
          readonly
        >
      </div>

      <div class="field">
        <label for="quantity">수량</label>
        <input
          id="quantity"
          type="text"
          placeholder="수량"
          readonly
        >
      </div>

    </div>

    <div class="hint">
      흰색 스티커의 Material No.와 Quantity만 읽습니다.<br>
      바코드는 읽지 않습니다.
    </div>

    <canvas id="canvas"></canvas>

  </div>

  <script>
    const photoInput = document.getElementById("photoInput");
    const statusBox = document.getElementById("status");
    const partNumberInput = document.getElementById("partNumber");
    const quantityInput = document.getElementById("quantity");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    function setStatus(message) {
      statusBox.textContent = message;
    }

    function cleanText(text) {
      return text
        .replace(/[|]/g, "1")
        .replace(/[Oo]/g, "0")
        .replace(/[Il]/g, "1")
        .replace(/[Ss]/g, "5")
        .replace(/[Bb]/g, "8")
        .replace(/\s+/g, " ")
        .trim();
    }

    function normalizePartNumber(value) {
      return value
        .replace(/[^0-9]/g, "")
        .trim();
    }

    function findPartNumber(text) {
      const cleaned = cleanText(text);

      /*
        BMW RDC 태그의 Material No.는
        사진에서 보통 다음처럼 인식될 수 있음:

        07 12 9 906 579
        07129906579
        07-12-9-906-579
      */

      const materialMatch = cleaned.match(
        /Material\s*No\.?\s*([0-9\s\-]{8,25})/i
      );

      if (materialMatch) {
        const number = normalizePartNumber(materialMatch[1]);

        if (number.length >= 9 && number.length <= 13) {
          return number;
        }
      }

      /*
        Material No. 글자를 놓쳤을 때를 위한 보조 검색.
        9~13자리 숫자 중 가장 앞에 있는 값을 사용.
      */

      const candidates = cleaned.match(/[0-9][0-9\s\-]{8,25}/g) || [];

      for (const candidate of candidates) {
        const number = normalizePartNumber(candidate);

        if (number.length >= 9 && number.length <= 13) {
          return number;
        }
      }

      return "";
    }

    function findQuantity(text) {
      const cleaned = cleanText(text);

      /*
        Quantity 4
        Quantity: 4
        Quantity - 4
        Quantity    4
      */

      const quantityMatch = cleaned.match(
        /Quantit[yv]\s*[:\-]?\s*([0-9]{1,5})/i
      );

      if (quantityMatch) {
        return quantityMatch[1];
      }

      /*
        Quantity 글자를 놓쳤을 때,
        사진 상단의 짧은 숫자를 보조 검색.
      */

      const shortNumbers = cleaned.match(/\b[0-9]{1,4}\b/g) || [];

      for (const number of shortNumbers) {
        if (number !== "2026") {
          return number;
        }
      }

      return "";
    }

    function preprocessImage(image, crop) {
      const sourceWidth = image.width;
      const sourceHeight = image.height;

      const sx = Math.max(0, Math.floor(sourceWidth * crop.x));
      const sy = Math.max(0, Math.floor(sourceHeight * crop.y));
      const sw = Math.min(
        Math.floor(sourceWidth * crop.width),
        sourceWidth - sx
      );
      const sh = Math.min(
        Math.floor(sourceHeight * crop.height),
        sourceHeight - sy
      );

      const scale = 4;

      canvas.width = sw * scale;
      canvas.height = sh * scale;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.drawImage(
        image,
        sx,
        sy,
        sw,
        sh,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const imageData = ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

      for (let i = 0; i < imageData.data.length; i += 4) {
        const r = imageData.data[i];
        const g = imageData.data[i + 1];
        const b = imageData.data[i + 2];

        const gray = (r + g + b) / 3;

        const value = gray > 155 ? 255 : 0;

        imageData.data[i] = value;
        imageData.data[i + 1] = value;
        imageData.data[i + 2] = value;
      }

      ctx.putImageData(imageData, 0, 0);

      return canvas.toDataURL("image/png");
    }

    async function recognizeRegion(image, crop, mode) {
      const processedImage = preprocessImage(image, crop);

      const whitelist =
        mode === "quantity"
          ? "0123456789"
          : "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz.- ";

      const result = await Tesseract.recognize(
        processedImage,
        "eng",
        {
          logger: function (message) {
            if (message.status === "recognizing text") {
              const percent = Math.round(message.progress * 100);
              setStatus(
                mode === "quantity"
                  ? `수량 인식 중... ${percent}%`
                  : `부품번호 인식 중... ${percent}%`
              );
            }
          },
          tessedit_pageseg_mode: "7",
          tessedit_char_whitelist: whitelist
        }
      );

      return result.data.text || "";
    }

    photoInput.addEventListener("change", async function () {
      const file = photoInput.files[0];

      if (!file) {
        return;
      }

      partNumberInput.value = "";
      quantityInput.value = "";

      setStatus("사진을 분석하는 중입니다...");

      const imageUrl = URL.createObjectURL(file);
      const image = new Image();

      image.onload = async function () {
        try {
          /*
            촬영할 때 흰색 RDC 스티커가
            화면 대부분을 차지하도록 찍는 것을 기준으로 함.

            Material No. 영역:
            왼쪽 위쪽 영역

            Quantity 영역:
            Material No. 오른쪽 영역
          */

          const materialCrop = {
            x: 0.08,
            y: 0.32,
            width: 0.48,
            height: 0.18
          };

          const quantityCrop = {
            x: 0.53,
            y: 0.32,
            width: 0.25,
            height: 0.18
          };

          const materialText = await recognizeRegion(
            image,
            materialCrop,
            "part"
          );

          const quantityText = await recognizeRegion(
            image,
            quantityCrop,
            "quantity"
          );

          const partNumber = findPartNumber(materialText);
          const quantity = findQuantity(quantityText);

          partNumberInput.value = partNumber;
          quantityInput.value = quantity;

          if (partNumber && quantity) {
            setStatus(
              "인식 완료\n" +
              "부품번호: " + partNumber + "\n" +
              "수량: " + quantity
            );
          } else {
            setStatus(
              "일부 인식 실패\n\n" +
              "부품번호 인식값: " + (partNumber || "없음") + "\n" +
              "수량 인식값: " + (quantity || "없음") +
              "\n\n흰색 스티커가 화면에 더 크게 나오도록 다시 촬영하세요."
            );
          }

        } catch (error) {
          console.error(error);

          setStatus(
            "인식 중 오류가 발생했습니다.\n" +
            "흰색 스티커를 가까이 찍고 다시 시도하세요."
          );
        } finally {
          URL.revokeObjectURL(imageUrl);
        }
      };

      image.onerror = function () {
        setStatus("사진을 불러오지 못했습니다.");
        URL.revokeObjectURL(imageUrl);
      };

      image.src = imageUrl;
    });
  </script>
</body>
</html>
