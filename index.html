<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>부품번호 수량 OCR</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      color: #222;
    }

    h2 {
      margin-top: 0;
    }

    button,
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 10px;
      font-size: 17px;
    }

    button {
      background: #222;
      color: white;
      border: 0;
      border-radius: 8px;
    }

    button:disabled {
      background: #999;
    }

    #preview {
      width: 100%;
      margin-top: 15px;
      border-radius: 8px;
      display: none;
    }

    .result {
      background: white;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      line-height: 1.8;
      word-break: break-all;
    }

    .label {
      font-weight: bold;
      margin-top: 10px;
    }

    #status {
      margin-top: 15px;
      color: #555;
    }
  </style>
</head>

<body>

  <h2>부품번호 + 수량 인식</h2>

  <input
    id="photoInput"
    type="file"
    accept="image/*"
    capture="environment"
  >

  <img id="preview">

  <button id="readButton" disabled>
    사진에서 부품번호와 수량 읽기
  </button>

  <div id="status"></div>

  <div class="result">
    <div class="label">부품번호</div>
    <input id="partNumber" placeholder="부품번호">

    <div class="label">수량</div>
    <input id="quantity" type="number" min="1" inputmode="numeric" placeholder="수량">

    <button id="copyButton">
      부품번호 + 수량 복사
    </button>
  </div>

  <script>
    const photoInput = document.getElementById("photoInput");
    const preview = document.getElementById("preview");
    const readButton = document.getElementById("readButton");
    const status = document.getElementById("status");
    const partNumber = document.getElementById("partNumber");
    const quantity = document.getElementById("quantity");
    const copyButton = document.getElementById("copyButton");

    let selectedFile = null;

    photoInput.addEventListener("change", () => {
      selectedFile = photoInput.files[0];

      if (!selectedFile) {
        readButton.disabled = true;
        return;
      }

      preview.src = URL.createObjectURL(selectedFile);
      preview.style.display = "block";
      readButton.disabled = false;
      status.textContent = "사진 준비 완료";
    });

    readButton.addEventListener("click", async () => {
      if (!selectedFile) {
        alert("사진을 먼저 촬영해 주세요.");
        return;
      }

      readButton.disabled = true;
      status.textContent = "글자 인식 중... 잠시만 기다려 주세요.";

      try {
        const result = await Tesseract.recognize(
          selectedFile,
          "eng",
          {
            logger: info => {
              if (info.status === "recognizing text") {
                status.textContent =
                  "글자 인식 중... " +
                  Math.round(info.progress * 100) +
                  "%";
              }
            }
          }
        );

        const text = result.data.text;

        console.log("OCR 전체 결과:", text);

        const cleanedText = text
          .toUpperCase()
          .replace(/[|]/g, "I")
          .replace(/[\n\r]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();

        const part = findPartNumber(cleanedText);
        const qty = findQuantity(cleanedText);

        partNumber.value = part || "";
        quantity.value = qty || "";

        if (part || qty) {
          status.textContent = "인식 완료. 결과를 확인해 주세요.";
        } else {
          status.textContent =
            "인식 실패. 부품번호와 수량이 크게 보이도록 다시 촬영해 주세요.";
        }

      } catch (error) {
        console.error(error);
        status.textContent = "글자 인식 중 오류가 발생했습니다.";
      }

      readButton.disabled = false;
    });

    function findPartNumber(text) {
      const matches = text.match(/[A-Z0-9]{8,15}/g);

      if (!matches) {
        return "";
      }

      const filtered = matches.filter(value => {
        return ![
          "PARTNUMBER",
          "PARTNO",
          "QUANTITY",
          "QTY",
          "BMW",
          "MIN",
          "MAX"
        ].includes(value);
      });

      if (filtered.length === 0) {
        return "";
      }

      return filtered[0];
    }

    function findQuantity(text) {
      let match;

      match = text.match(/(?:QTY|QUANTITY|수량)\s*[:\-]?\s*(\d{1,5})/i);

      if (match) {
        return match[1];
      }

      match = text.match(/(\d{1,5})\s*(?:EA|PCS|개)/i);

      if (match) {
        return match[1];
      }

      return "";
    }

    copyButton.addEventListener("click", async () => {
      const part = partNumber.value.trim();
      const qty = quantity.value.trim();

      if (!part || !qty) {
        alert("부품번호와 수량을 모두 확인해 주세요.");
        return;
      }

      const copyText = part + "\t" + qty;

      try {
        await navigator.clipboard.writeText(copyText);
        status.textContent = "부품번호와 수량이 복사되었습니다.";
      } catch (error) {
        alert(copyText);
      }
    });
  </script>

</body>
</html>
