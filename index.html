<script>

/* ============================================================
   설정
============================================================ */

/*
 * 네 Material No.가 11자리 숫자이므로
 * 11자리를 가장 강하게 우선시한다.
 */
const MATERIAL_NO_LENGTH = 11;


/*
 * 동일한 값이 몇 번 감지되어야 확정할지
 */
const REQUIRED_CONFIRMATIONS = 3;


/*
 * 동일 번호 인정 시간
 */
const CONFIRM_WINDOW_MS = 1800;


/*
 * 너무 짧은 바코드는 오검출 가능성이 높으므로 무시
 */
const MIN_RAW_LENGTH = 4;


/* ============================================================
   전역 상태
============================================================ */

let scannerRunning = false;

let currentTrack = null;

let currentZoom = 1;

let minZoom = 1;

let maxZoom = 1;

let torchOn = false;


/*
 * 동일 바코드 반복 확인용
 */
let candidateValue = "";

let candidateCount = 0;

let candidateFirstTime = 0;


/*
 * 마지막 확정 코드
 */
let lastAcceptedCode = "";

let lastAcceptedTime = 0;


/*
 * Quagga 설정 중복 방지
 */
let quaggaDetectedHandlerAttached = false;


/* ============================================================
   숫자만 추출
============================================================ */

function onlyDigits(value){

    return String(value || "")
        .replace(/\D/g, "");

}


/* ============================================================
   Material No. 추출
============================================================ */

/*
 * 바코드 원본값을 받아서
 * 11자리 Material No. 후보를 찾는다.
 *
 * 예:
 *
 * 12 34 5 678 901
 * ↓
 * 12345678901
 *
 * 12345678901ABC
 * ↓
 * 12345678901
 */

function extractMaterialNo(raw){

    if(
        raw === null ||
        raw === undefined
    ){
        return null;
    }


    const text =
        String(raw).trim();


    if(!text){
        return null;
    }


    /*
     * 1단계
     * 숫자만 추출
     */

    const digits =
        onlyDigits(text);


    /*
     * 정확히 11자리
     */

    if(
        digits.length === MATERIAL_NO_LENGTH
    ){

        return digits;

    }


    /*
     * 숫자 사이에 문자가 조금 섞였어도
     * 11자리 연속 숫자가 있으면 사용
     */

    const exactMatch =
        text.match(
            /\d{11}/g
        );


    if(exactMatch && exactMatch.length){

        return exactMatch[0];

    }


    /*
     * 숫자에 공백 또는 - 등이 들어간 경우
     *
     * 예:
     * 1234 567 8901
     */

    const grouped =
        text.match(
            /(?:\d[\s-]*){11}/g
        );


    if(grouped && grouped.length){

        const cleaned =
            onlyDigits(
                grouped[0]
            );

        if(
            cleaned.length ===
            MATERIAL_NO_LENGTH
        ){

            return cleaned;

        }

    }


    /*
     * 전체 숫자가 11자리 이상이면
     * 앞쪽부터 11자리 후보
     */

    if(
        digits.length >
        MATERIAL_NO_LENGTH
    ){

        /*
         * 정확히 11자리짜리 구간이
         * 있는 경우 우선 반환
         */

        for(
            let i = 0;
            i <= digits.length - MATERIAL_NO_LENGTH;
            i++
        ){

            const part =
                digits.slice(
                    i,
                    i + MATERIAL_NO_LENGTH
                );

            if(
                part.length ===
                MATERIAL_NO_LENGTH
            ){

                return part;

            }

        }

    }


    /*
     * 그 외에는 Material No. 아님
     */

    return null;

}


/* ============================================================
   숫자 형식 검사
============================================================ */

function isValidMaterialNo(value){

    return /^\d{11}$/.test(
        String(value || "")
    );

}


/* ============================================================
   상태 표시
============================================================ */

function setStatus(
    message,
    type = ""
){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        message;


    status.className =
        "status";


    if(type){

        status.classList.add(type);

    }

}


/* ============================================================
   스캐너 시작
============================================================ */

async function startScanner(){

    if(scannerRunning){

        return;

    }


    /*
     * 초기화
     */

    candidateValue = "";

    candidateCount = 0;

    candidateFirstTime = 0;

    lastAcceptedCode = "";

    lastAcceptedTime = 0;

    currentTrack = null;

    torchOn = false;


    /*
     * UI
     */

    document
        .getElementById(
            "scannerBox"
        )
        .style.display = "block";


    document
        .getElementById(
            "manualBox"
        )
        .style.display = "none";


    document
        .getElementById(
            "result"
        )
        .innerHTML = "";


    document
        .getElementById(
            "detectedBox"
        )
        .style.display = "none";


    setStatus(
        "카메라를 준비하고 있습니다...",
        "warning"
    );


    /*
     * 브라우저 카메라 지원 확인
     */

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        setStatus(
            "이 브라우저에서는 카메라를 사용할 수 없습니다.",
            "error"
        );

        showManualBox();

        return;

    }


    try{

        /*
         * Quagga가 카메라를 직접 열게 한다.
         */
        await initializeQuagga();


    }catch(error){

        console.error(
            "Scanner error:",
            error
        );


        scannerRunning = false;


        setStatus(
            "카메라를 열 수 없습니다. 카메라 권한을 확인해주세요.",
            "error"
        );


        showManualBox();

    }

}


/* ============================================================
   Quagga 초기화
============================================================ */

function initializeQuagga(){

    return new Promise(
        function(resolve, reject){

            /*
             * Quagga가 이미 실행 중이면 먼저 종료
             */

            try{

                Quagga.stop();

            }catch(e){}


            /*
             * 설정
             */

            Quagga.init({

                inputStream:{

                    name:"Live",

                    type:"LiveStream",

                    target:
                        document.querySelector(
                            "#scanner"
                        ),

                    constraints:{

                        facingMode:{
                            ideal:"environment"
                        },

                        width:{
                            min:1280,
                            ideal:1920,
                            max:2560
                        },

                        height:{
                            min:720,
                            ideal:1080,
                            max:1440
                        }
                    },

                    /*
                     * 가운데 영역을 집중적으로 분석
                     *
                     * 주변 Quantity / Location 글자는
                     * 바코드 판독 대상이 아니므로
                     * 실제 바코드가 있는 영역을 중심으로 잡는다.
                     */

                    area:{
                        top:"18%",
                        right:"5%",
                        left:"5%",
                        bottom:"18%"
                    }

                },


                /*
                 * 작은 바코드 인식 강화
                 */

                locator:{

                    halfSample:false,

                    patchSize:"medium"

                },


                /*
                 * 스캔 빈도
                 */

                frequency:10,


                /*
                 * 자동 위치 찾기
                 */

                locate:true,


                decoder:{

                    /*
                     * Code 128을 가장 우선
                     *
                     * BMW 계열 부품 태그에서
                     * Code 128 계열이 많이 사용되므로
                     * 우선적으로 시도한다.
                     */

                    readers:[

                        "code_128_reader",

                        "code_39_reader",

                        "code_93_reader",

                        "ean_reader",

                        "ean_8_reader",

                        "upc_reader",

                        "upc_e_reader",

                        "i2of5_reader",

                        "2of5_reader",

                        "codabar_reader"

                    ],

                    multiple:false

                },


                /*
                 * 멀티스레딩보다
                 * 모바일 브라우저 안정성을 우선
                 */

                numOfWorkers:2,


                debug:{

                    drawBoundingBox:false,

                    showFrequency:false,

                    drawScanline:false,

                    showPattern:false

                }

            }, function(error){

                if(error){

                    console.error(
                        "Quagga init:",
                        error
                    );

                    reject(error);

                    return;

                }


                try{

                    Quagga.start();

                    scannerRunning = true;

                }catch(e){

                    reject(e);

                    return;

                }


                /*
                 * 카메라 트랙 가져오기
                 */

                setTimeout(
                    setupCameraTrack,
                    800
                );


                setStatus(
                    "바코드를 사각형 안에 크게 맞춰주세요.",
                    "warning"
                );


                attachDetectedHandler();


                resolve();

            });

        }
    );

}


/* ============================================================
   카메라 트랙 가져오기
============================================================ */

function setupCameraTrack(){

    try{

        const video =
            document.querySelector(
                "#scanner video"
            );


        if(
            !video ||
            !video.srcObject
        ){

            return;

        }


        const tracks =
            video
                .srcObject
                .getVideoTracks();


        if(
            !tracks ||
            !tracks.length
        ){

            return;

        }


        currentTrack =
            tracks[0];


        setupCameraCapabilities();


    }catch(error){

        console.log(
            "Camera track error:",
            error
        );

    }

}


/* ============================================================
   카메라 기능 확인
============================================================ */

function setupCameraCapabilities(){

    if(!currentTrack){

        return;

    }


    try{

        const capabilities =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};


        /*
         * 줌
         */

        if(capabilities.zoom){

            minZoom =
                capabilities.zoom.min || 1;

            maxZoom =
                capabilities.zoom.max || 1;


            /*
             * 첫 시작은 1.5배 정도
             */

            currentZoom =
                Math.min(
                    Math.max(
                        1.5,
                        minZoom
                    ),
                    maxZoom
                );


            applyZoom();

        }else{

            minZoom = 1;

            maxZoom = 1;

        }


        /*
         * 연속 자동초점
         */

        if(
            capabilities.focusMode
        ){

            try{

                if(
                    capabilities.focusMode
                        .includes("continuous")
                ){

                    currentTrack.applyConstraints({

                        advanced:[
                            {
                                focusMode:
                                    "continuous"
                            }
                        ]

                    });

                }

            }catch(e){}

        }


    }catch(error){

        console.log(
            "Capability error:",
            error
        );

    }

}


/* ============================================================
   바코드 검출 이벤트 연결
============================================================ */

function attachDetectedHandler(){

    if(
        quaggaDetectedHandlerAttached
    ){

        return;

    }


    quaggaDetectedHandlerAttached =
        true;


    Quagga.onDetected(
        processDetectedBarcode
    );

}


/* ============================================================
   바코드 검출 처리
============================================================ */

function processDetectedBarcode(result){

    if(!scannerRunning){

        return;

    }


    if(
        !result ||
        !result.codeResult
    ){

        return;

    }


    const raw =
        result.codeResult.code;


    if(!raw){

        return;

    }


    const rawText =
        String(raw).trim();


    if(
        rawText.length <
        MIN_RAW_LENGTH
    ){

        return;

    }


    console.log(
        "Quagga raw:",
        rawText,
        "format:",
        result.codeResult.format
    );


    /*
     * ★ 핵심
     *
     * 바코드에서 나온 값 중
     * 11자리 Material No.만 후보로 인정
     *
     * Quantity / Location의 숫자는
     * OCR로 읽지 않기 때문에
     * 기본적으로 여기에 들어오지 않는다.
     */

    const materialNo =
        extractMaterialNo(
            rawText
        );


    /*
     * 11자리 아니면 무시
     */

    if(
        !materialNo ||
        !isValidMaterialNo(materialNo)
    ){

        setScanConfirmMessage(
            "바코드를 찾았지만 Material No. 형식이 아닙니다."
        );

        return;

    }


    const now =
        Date.now();


    /*
     * 이미 방금 확정했던 번호라면
     * 중복 처리 방지
     */

    if(
        materialNo ===
        lastAcceptedCode &&
        now - lastAcceptedTime < 3000
    ){

        return;

    }


    /*
     * 같은 번호를 계속 보고 있는지 확인
     */

    if(
        candidateValue ===
        materialNo &&
        now - candidateFirstTime <=
        CONFIRM_WINDOW_MS
    ){

        candidateCount++;

    }else{

        candidateValue =
            materialNo;

        candidateCount = 1;

        candidateFirstTime =
            now;

    }


    /*
     * 화면 표시
     */

    showDetectedNumber(
        materialNo
    );


    setScanConfirmMessage(
        "Material No. 확인 중 " +
        Math.min(
            candidateCount,
            REQUIRED_CONFIRMATIONS
        ) +
        "/" +
        REQUIRED_CONFIRMATIONS
    );


    /*
     * 3번 동일하게 확인되면 확정
     */

    if(
        candidateCount >=
        REQUIRED_CONFIRMATIONS
    ){

        lastAcceptedCode =
            materialNo;

        lastAcceptedTime =
            Date.now();


        acceptBarcode(
            materialNo
        );

    }

}


/* ============================================================
   확정된 바코드 처리
============================================================ */

function acceptBarcode(materialNo){

    /*
     * 카메라 종료
     */

    stopScanner();


    /*
     * 결과 표시
     */

    showDetectedNumber(
        materialNo
    );


    setStatus(
        "✅ Material No. 인식 완료: " +
        materialNo,
        "success"
    );


    /*
     * 부품 조회
     */

    lookupPart(
        materialNo
    );

}

/* ============================================================
   스캐너 종료
============================================================ */

function stopScanner(){

    try{

        if(scannerRunning){

            Quagga.stop();

        }

    }catch(e){

        console.log(
            "Quagga stop:",
            e
        );

    }


    scannerRunning = false;


    /*
     * 카메라 트랙 완전히 종료
     */

    try{

        if(currentTrack){

            currentTrack.stop();

        }

    }catch(e){}


    currentTrack = null;


    document
        .getElementById(
            "scannerBox"
        )
        .style.display = "none";


    /*
     * 상태 초기화
     */

    candidateValue = "";

    candidateCount = 0;

    candidateFirstTime = 0;

    torchOn = false;

}


/* ============================================================
   줌 +
============================================================ */

async function zoomIn(){

    if(!currentTrack){

        setStatus(
            "카메라가 아직 준비되지 않았습니다.",
            "warning"
        );

        return;

    }


    if(
        maxZoom <= minZoom
    ){

        setStatus(
            "이 휴대폰에서는 웹 줌을 지원하지 않습니다.",
            "warning"
        );

        return;

    }


    currentZoom =
        Math.min(
            currentZoom + 0.5,
            maxZoom
        );


    await applyZoom();

}


/* ============================================================
   줌 -
============================================================ */

async function zoomOut(){

    if(!currentTrack){

        return;

    }


    if(
        maxZoom <= minZoom
    ){

        return;

    }


    currentZoom =
        Math.max(
            currentZoom - 0.5,
            minZoom
        );


    await applyZoom();

}


/* ============================================================
   줌 적용
============================================================ */

async function applyZoom(){

    if(!currentTrack){

        return;

    }


    try{

        await currentTrack.applyConstraints({

            advanced:[
                {
                    zoom:currentZoom
                }
            ]

        });


        console.log(
            "Zoom:",
            currentZoom
        );


    }catch(error){

        console.log(
            "Zoom error:",
            error
        );

    }

}


/* ============================================================
   손전등
============================================================ */

async function toggleTorch(){

    if(!currentTrack){

        setStatus(
            "카메라가 아직 준비되지 않았습니다.",
            "warning"
        );

        return;

    }


    try{

        const capabilities =
            currentTrack.getCapabilities
                ? currentTrack.getCapabilities()
                : {};


        if(!capabilities.torch){

            setStatus(
                "이 휴대폰 브라우저에서는 조명을 지원하지 않습니다.",
                "warning"
            );

            return;

        }


        torchOn =
            !torchOn;


        await currentTrack.applyConstraints({

            advanced:[
                {
                    torch:
                        torchOn
                }
            ]

        });


    }catch(error){

        console.log(
            "Torch error:",
            error
        );

    }

}


/* ============================================================
   수동 검색
============================================================ */

function manualSearch(){

    const input =
        document.getElementById(
            "manualBarcode"
        );


    const raw =
        input.value.trim();


    if(!raw){

        setStatus(
            "Material No.를 입력해주세요.",
            "error"
        );

        return;

    }


    /*
     * 수동 입력도 11자리 우선
     */

    const materialNo =
        extractMaterialNo(
            raw
        );


    if(
        materialNo &&
        isValidMaterialNo(materialNo)
    ){

        input.value =
            materialNo;


        lookupPart(
            materialNo
        );

        return;

    }


    /*
     * 혹시 기존 데이터가 11자리가 아닐 경우
     * 원래 입력값으로 조회
     */

    lookupPart(
        raw
    );

}


/* ============================================================
   부품 조회
============================================================ */

function lookupPart(partNo){

    partNo =
        String(partNo || "")
            .trim();


    if(!partNo){

        return;

    }


    document
        .getElementById(
            "loading"
        )
        .style.display = "block";


    document
        .getElementById(
            "result"
        )
        .innerHTML = "";


    setStatus(
        "부품 정보를 조회하고 있습니다...",
        "warning"
    );


    /*
     * =====================================================
     * 1. Google Apps Script 환경
     * =====================================================
     */

    if(
        typeof google !== "undefined" &&
        google.script &&
        google.script.run
    ){

        google.script.run

            .withSuccessHandler(
                function(data){

                    document
                        .getElementById(
                            "loading"
                        )
                        .style.display = "none";


                    displayPart(
                        data
                    );

                }
            )

            .withFailureHandler(
                function(error){

                    document
                        .getElementById(
                            "loading"
                        )
                        .style.display = "none";


                    console.error(
                        error
                    );


                    setStatus(
                        "부품 조회 중 오류가 발생했습니다.",
                        "error"
                    );

                }
            )

            .getPart(
                partNo
            );


        return;

    }


    /*
     * =====================================================
     * 2. GitHub Pages
     *
     * 기존 GitHub 페이지가 별도의 API를 연결하지 않은 경우
     * 일단 인식된 Material No. 자체는 정확하게 표시한다.
     *
     * 실제 재고 조회 API가 연결되어 있으면
     * 아래 부분을 그 API에 맞춰 연결할 수 있다.
     * =====================================================
     */

    displayPart({

        partNo:partNo

    });

}


/* ============================================================
   조회 결과 표시
============================================================ */

function displayPart(data){

    if(!data){

        document
            .getElementById(
                "loading"
            )
            .style.display = "none";


        setStatus(
            "등록된 부품을 찾을 수 없습니다.",
            "error"
        );

        return;

    }


    /*
     * 다양한 데이터 형식 대응
     */

    const partNo =
        data.partNo ||
        data.partNumber ||
        data.materialNo ||
        data["부품번호"] ||
        "";


    const name =
        data.name ||
        data.partName ||
        data.description ||
        data["품명"] ||
        "";


    const spec =
        data.spec ||
        data.specification ||
        data["규격"] ||
        "";


    const stock =
        data.stock ??
        data.currentStock ??
        data["현재고"] ??
        "";


    const location =
        data.location ||
        data.currentLocation ||
        data["현재 로케이션"] ||
        "";


    const assignedLocation =
        data.assignedLocation ||
        data.designatedLocation ||
        data["지정 로케이션"] ||
        "";


    document
        .getElementById(
            "result"
        )
        .innerHTML = `

            <div class="card">

                <div class="result-row">

                    <div class="label">
                        Material No.
                    </div>

                    <div class="value">
                        ${escapeHtml(partNo)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        품명
                    </div>

                    <div class="value">
                        ${escapeHtml(name)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        규격
                    </div>

                    <div class="value">
                        ${escapeHtml(spec)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        현재고
                    </div>

                    <div class="value">
                        ${escapeHtml(stock)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        현재 로케이션
                    </div>

                    <div class="value">
                        ${escapeHtml(location)}
                    </div>

                </div>


                <div class="result-row">

                    <div class="label">
                        지정 로케이션
                    </div>

                    <div class="value">
                        ${escapeHtml(
                            assignedLocation
                        )}
                    </div>

                </div>

            </div>

        `;


    document
        .getElementById(
            "loading"
        )
        .style.display = "none";


    /*
     * GitHub Pages에서 API가 아직 연결되지 않은 경우
     * Material No.만 나온 상태이므로
     * 메시지를 구분한다.
     */

    if(
        !name &&
        !spec &&
        stock === "" &&
        !location
    ){

        setStatus(
            "✅ Material No. 인식 완료: " +
            partNo +
            " / 재고 데이터 연결 대기",
            "success"
        );

    }else{

        setStatus(
            "✅ 부품 조회 완료",
            "success"
        );

    }

}


/* ============================================================
   HTML escape
============================================================ */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
